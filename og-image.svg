<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#021a04"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#008f25"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Matrix-style falling chars (decorative) -->
  <g font-family="Share Tech Mono, monospace" font-size="14" fill="#00ff41" opacity="0.18">
    <text x="60"  y="100">01001100 01100101</text>
    <text x="60"  y="125">73 75 6E 64 75 73 74</text>
    <text x="60"  y="150">FF D8 FF E0 00 10 4A</text>
    <text x="980" y="120">28 6F 70 65 6E</text>
    <text x="980" y="145">7F 45 4C 46 02 01</text>
    <text x="980" y="170">[FILE] $MFT</text>
    <text x="60"  y="540">$STANDARD_INFORMATION</text>
    <text x="60"  y="565">cluster_size = 4096</text>
    <text x="60"  y="590">SHA-256 verified ✓</text>
    <text x="950" y="540">art. 143bis CP</text>
    <text x="950" y="565">RFC 3227</text>
    <text x="950" y="590">ISO/IEC 27037</text>
  </g>

  <!-- Terminal frame -->
  <g transform="translate(120, 200)">
    <rect x="0" y="0" width="960" height="230" rx="14"
          fill="rgba(0,20,0,0.7)" stroke="#00ff41" stroke-width="1.5" opacity="0.95"/>
    <!-- Terminal dots -->
    <circle cx="22" cy="22" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="22" r="6" fill="#27c93f"/>
    <text x="86" y="27" font-family="Share Tech Mono, monospace" font-size="13"
          fill="#00ff41" opacity="0.6">cas-in@forensique ~ %</text>
    <line x1="0" y1="42" x2="960" y2="42" stroke="#00ff41" stroke-width="1" opacity="0.2"/>

    <!-- Title -->
    <text x="40" y="105" font-family="Syne, sans-serif" font-weight="800"
          font-size="64" fill="url(#green)" filter="url(#glow)">CAS-IN</text>

    <!-- Subtitle -->
    <text x="40" y="145" font-family="Share Tech Mono, monospace" font-size="20"
          fill="#00ff41" opacity="0.9">Investigation Numérique Forensique</text>

    <!-- Stats line -->
    <text x="40" y="190" font-family="Share Tech Mono, monospace" font-size="16"
          fill="#00ff41" opacity="0.6">
      <tspan>$ </tspan><tspan fill="#eeffee">stats --all</tspan>
    </text>
    <text x="40" y="212" font-family="Share Tech Mono, monospace" font-size="14"
          fill="#00ff41" opacity="0.85">
      → 1630 questions · 90 fiches · 64 scénarios · 25 TP · Droit suisse
    </text>
  </g>

  <!-- Bottom badge -->
  <g transform="translate(0, 590)">
    <rect x="0" y="0" width="1200" height="40" fill="rgba(0,255,65,0.05)"/>
    <text x="600" y="26" font-family="Share Tech Mono, monospace" font-size="13"
          fill="#00ff41" opacity="0.5" text-anchor="middle">
      v2.4 · 2025–2026 · zufferdi.github.io/CAS-IN
    </text>
  </g>

  <!-- Magnifying glass icon top-right -->
  <g transform="translate(1050, 100)" opacity="0.85">
    <circle cx="0" cy="0" r="36" fill="none" stroke="#00ff41" stroke-width="3"/>
    <line x1="26" y1="26" x2="50" y2="50" stroke="#00ff41" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#00ff41" stroke-width="3" filter="url(#glow)" opacity="0.5"/>
  </g>
</svg>
