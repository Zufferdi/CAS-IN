<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#1a0633"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b794f4"/>
      <stop offset="100%" stop-color="#553c9a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b794f4" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Hex / data decoration -->
  <g font-family="Share Tech Mono, monospace" font-size="14" fill="#b794f4" opacity="0.18">
    <text x="60"  y="100">01001100 01100101</text>
    <text x="60"  y="125">73 75 6E 64 75 73 74</text>
    <text x="60"  y="560">0xCA51_DEAD · 0xBADCAFE</text>
    <text x="950" y="560">3 niveaux</text>
    <text x="950" y="585">Quiz inclus</text>
    <text x="950" y="610">Cross-platform</text>
  </g>

  <!-- Terminal frame -->
  <g transform="translate(120, 175)">
    <rect x="0" y="0" width="960" height="280" rx="14"
          fill="rgba(0,0,0,0.7)" stroke="#b794f4" stroke-width="1.5" opacity="0.95"/>
    <!-- Terminal dots -->
    <circle cx="22" cy="22" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="22" r="6" fill="#27c93f"/>
    <text x="86" y="27" font-family="Share Tech Mono, monospace" font-size="13"
          fill="#b794f4" opacity="0.6">cas-in@forensique ~ % tutoriels --start</text>
    <line x1="0" y1="42" x2="960" y2="42" stroke="#b794f4" stroke-width="1" opacity="0.2"/>

    <!-- Page emoji + Title -->
    <text x="40" y="115" font-family="Syne, sans-serif" font-weight="800"
          font-size="36" fill="#b794f4" opacity="0.65">🎓</text>
    <text x="100" y="115" font-family="Syne, sans-serif" font-weight="800"
          font-size="58" fill="url(#accent)" filter="url(#glow)">TUTORIELS DFIR</text>

    <!-- Subtitle -->
    <text x="40" y="160" font-family="Share Tech Mono, monospace" font-size="18"
          fill="#b794f4" opacity="0.85">28 outils open source pas à pas</text>

    <!-- Stats / description -->
    <text x="40" y="208" font-family="Share Tech Mono, monospace" font-size="14"
          fill="#b794f4" opacity="0.55">
      <tspan>$ </tspan><tspan fill="#ffffff">cat /tutoriels/index</tspan>
    </text>
    <text x="40" y="232" font-family="Share Tech Mono, monospace" font-size="14"
          fill="#b794f4" opacity="0.85">
      → Autopsy · IPED · MVT · Plaso · Volatility · KAPE · Wireshark
    </text>
    <text x="40" y="255" font-family="Share Tech Mono, monospace" font-size="13"
          fill="#b794f4" opacity="0.55">
      → CAS-IN · Investigation Numérique Forensique
    </text>
  </g>

  <!-- Bottom strip -->
  <g transform="translate(0, 590)">
    <rect x="0" y="0" width="1200" height="40" fill="#b794f4" opacity="0.05"/>
    <text x="600" y="26" font-family="Share Tech Mono, monospace" font-size="13"
          fill="#b794f4" opacity="0.5" text-anchor="middle">
      zufferdi.github.io/CAS-IN/tutoriels.html
    </text>
  </g>
</svg>
