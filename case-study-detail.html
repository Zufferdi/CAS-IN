<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>
(function(){try{var p=localStorage.getItem('cas_theme_pref');
document.documentElement.setAttribute('data-theme',p==='light'?'light':'dark');}catch(e){
document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Étude de cas · CAS-IN</title>
<meta name="description" content="Étude de cas guidée · CAS-IN">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="pwa.manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@700;800&display=swap">
<link rel="stylesheet" href="style/landing.css">
<link rel="stylesheet" href="style/profile.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
  .csd-page { max-width: 980px; margin: 0 auto; padding: 18px 16px 80px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--dim); text-decoration: none; font-size: 13px;
    margin-bottom: 16px;
  }
  .back-link:hover { color: var(--text); }

  /* Header de l'étude */
  .csd-header {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 22px;
  }
  .csd-header-top {
    display: flex; align-items: center; gap: 14px; margin-bottom: 8px;
  }
  .csd-icon { font-size: 38px; line-height: 1; }
  .csd-title-block { flex: 1; }
  .csd-title {
    font-family: 'Syne', sans-serif;
    font-size: 24px; font-weight: 800; margin: 0;
    line-height: 1.2;
  }
  .csd-subtitle {
    color: var(--dim); font-size: 14px; margin-top: 4px;
  }
  .csd-summary {
    font-size: 14px; line-height: 1.6;
    color: var(--text); opacity: .88;
    margin-top: 10px;
  }
  .csd-meta {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 14px;
    font-size: 11px;
  }
  .csd-meta span {
    padding: 3px 9px;
    background: rgba(255,255,255,.06);
    border-radius: 4px;
    color: var(--dim);
  }
  .csd-level-badge {
    padding: 3px 9px; border-radius: 4px; font-weight: 700;
    text-transform: uppercase;
  }
  .csd-level-stagiaire { background: rgba(126,192,255,.2); color: #7ec0ff; }
  .csd-level-inspecteur { background: rgba(160,255,180,.2); color: #80e0a0; }
  .csd-level-enqueteur { background: rgba(255,200,100,.2); color: #ffc864; }
  .csd-level-expert { background: rgba(255,128,128,.2); color: #ff8080; }

  /* Stepper des 7 sections */
  .csd-stepper {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 22px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 12px;
  }
  .csd-step {
    flex: 1; min-width: 110px;
    padding: 9px 8px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    font-size: 11px;
    color: var(--dim);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .csd-step:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .csd-step.active {
    background: rgba(126,192,255,.15);
    border-color: rgba(126,192,255,.4);
    color: #7ec0ff;
  }
  .csd-step.done {
    background: rgba(160,255,180,.08);
    border-color: rgba(160,255,180,.3);
    color: #80e0a0;
  }
  .csd-step.done .csd-step-icon::after { content: ' ✓'; }
  .csd-step-icon { font-size: 18px; }
  .csd-step-name { font-weight: 600; }

  /* Section content */
  .csd-section {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;
    padding: 24px 26px;
    margin-bottom: 16px;
  }
  .csd-section-title {
    font-family: 'Syne', sans-serif;
    font-size: 20px; font-weight: 800;
    margin: 0 0 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .csd-section-intro {
    font-size: 14px; color: var(--dim);
    line-height: 1.6; margin-bottom: 16px;
  }

  /* Timeline */
  .timeline-list {
    list-style: none; padding: 0; margin: 0;
    border-left: 2px solid rgba(126,192,255,.3);
    padding-left: 18px;
  }
  .timeline-item { margin-bottom: 18px; position: relative; }
  .timeline-item::before {
    content: ''; position: absolute;
    left: -23px; top: 6px;
    width: 8px; height: 8px;
    background: #7ec0ff;
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(126,192,255,.15);
  }
  .timeline-date {
    font-family: 'Share Tech Mono', monospace;
    color: #7ec0ff; font-size: 12px; font-weight: 700;
  }
  .timeline-title { font-weight: 700; margin: 3px 0; }
  .timeline-desc { color: var(--dim); font-size: 13px; line-height: 1.55; }

  /* Actors */
  .actors-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 16px; }
  .actor-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .actor-role { font-size: 10px; color: #7ec0ff; text-transform: uppercase; font-weight: 700; }
  .actor-name { font-weight: 700; margin: 3px 0; }
  .actor-desc { font-size: 12px; color: var(--dim); line-height: 1.5; }

  /* Stakes box */
  .stakes-box {
    background: rgba(255,200,100,.06);
    border: 1px solid rgba(255,200,100,.25);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 18px;
    font-size: 13px;
    line-height: 1.6;
  }
  .stakes-box strong { color: #ffc864; }

  /* Quiz */
  .quiz-question {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .quiz-q-text { font-weight: 600; margin-bottom: 10px; line-height: 1.5; }
  .quiz-opts { display: grid; gap: 6px; }
  .quiz-opt {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 13px;
  }
  .quiz-opt:hover { background: rgba(255,255,255,.07); }
  .quiz-opt.selected { background: rgba(126,192,255,.12); border-color: rgba(126,192,255,.4); }
  .quiz-opt.correct { background: rgba(160,255,180,.12); border-color: rgba(160,255,180,.4); color: #80e0a0; }
  .quiz-opt.incorrect { background: rgba(255,128,128,.1); border-color: rgba(255,128,128,.4); color: #ff8080; }
  .quiz-opt.disabled { cursor: default; pointer-events: none; }
  .quiz-expl {
    background: rgba(126,192,255,.06);
    border-left: 3px solid #7ec0ff;
    padding: 8px 12px;
    margin-top: 8px;
    font-size: 12px;
    line-height: 1.55;
    color: var(--dim);
    border-radius: 0 6px 6px 0;
  }
  .quiz-validate {
    background: #7ec0ff; color: #000;
    border: none; border-radius: 8px;
    padding: 10px 18px;
    font-weight: 700; font-size: 13px;
    cursor: pointer;
    margin-top: 14px;
    transition: opacity 0.15s;
  }
  .quiz-validate:hover { opacity: 0.85; }
  .quiz-validate:disabled { opacity: 0.4; cursor: not-allowed; }
  .quiz-result {
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    font-weight: 600;
  }
  .quiz-result.pass { background: rgba(160,255,180,.12); border: 1px solid rgba(160,255,180,.4); color: #80e0a0; }
  .quiz-result.fail { background: rgba(255,128,128,.1); border: 1px solid rgba(255,128,128,.4); color: #ff8080; }

  /* Fiches suggérées */
  .fiches-list { display: grid; gap: 10px; margin-top: 14px; }
  .fiche-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 12px 14px;
    text-decoration: none;
    color: inherit;
    transition: all 0.15s;
  }
  .fiche-card:hover {
    background: rgba(255,255,255,.07);
    border-color: rgba(126,192,255,.3);
  }
  .fiche-card.essential {
    border-color: rgba(255,200,100,.4);
    background: rgba(255,200,100,.04);
  }
  .fiche-title { font-weight: 700; font-size: 14px; }
  .fiche-focus { font-size: 12px; color: var(--dim); margin-top: 4px; line-height: 1.5; }

  /* Scènes */
  .scenes-list { display: grid; gap: 10px; margin-top: 14px; }
  .scene-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 12px 14px;
    text-decoration: none;
    color: inherit;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .scene-card:hover {
    background: rgba(255,255,255,.07);
    border-color: rgba(126,192,255,.3);
  }
  .scene-card-content { flex: 1; }
  .scene-card-title { font-weight: 700; font-size: 14px; }
  .scene-card-focus { font-size: 12px; color: var(--dim); margin-top: 4px; line-height: 1.5; }
  .scene-card-diff {
    font-size: 10px; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; font-weight: 700;
    background: rgba(255,128,128,.15); color: #ff8080;
  }
  .scene-arrow { color: var(--dim); font-size: 18px; }

  /* Post-analysis */
  .analysis-section {
    background: rgba(255,255,255,.03);
    border-left: 3px solid #7ec0ff;
    padding: 12px 16px;
    margin-bottom: 12px;
    border-radius: 0 8px 8px 0;
  }
  .analysis-section h4 {
    font-family: 'Syne', sans-serif;
    margin: 0 0 8px; font-size: 15px;
    color: #7ec0ff;
  }
  .analysis-section p { font-size: 13px; line-height: 1.6; margin: 0; color: var(--text); opacity: .9; }

  /* Lessons */
  .lessons-list { display: grid; gap: 12px; margin-top: 14px; }
  .lesson-item {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .lesson-icon { font-size: 26px; line-height: 1; flex-shrink: 0; }
  .lesson-content { flex: 1; }
  .lesson-title {
    font-weight: 700; margin-bottom: 4px;
    color: #7ec0ff;
  }
  .lesson-text {
    font-size: 13px; line-height: 1.6; color: var(--text); opacity: .9;
  }

  /* Arcs & sources */
  .arcs-list, .sources-list { display: grid; gap: 8px; margin-top: 12px; }
  .arc-item, .source-item {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .arc-title { font-weight: 700; color: #80e0a0; }
  .arc-scene { font-size: 11px; color: var(--dim); margin-left: 8px; }
  .arc-desc { font-size: 12px; color: var(--dim); margin-top: 4px; line-height: 1.5; }
  .source-link { color: #7ec0ff; text-decoration: none; word-break: break-all; }
  .source-link:hover { text-decoration: underline; }
  .source-date { color: var(--dim); font-size: 11px; margin-left: 6px; }

  /* Nav buttons */
  .csd-nav {
    display: flex; justify-content: space-between; gap: 10px; margin-top: 22px;
  }
  .csd-nav button, .csd-mark-done {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.15);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.15s;
  }
  .csd-nav button:hover, .csd-mark-done:hover { background: rgba(255,255,255,.1); }
  .csd-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
  .csd-mark-done.primary {
    background: #7ec0ff; color: #000; border-color: #7ec0ff;
  }
  .csd-mark-done.primary:hover { opacity: 0.85; }
  .csd-mark-done.done {
    background: rgba(160,255,180,.15); color: #80e0a0; border-color: rgba(160,255,180,.4);
  }

  /* Loading */
  .csd-loading { padding: 40px; text-align: center; color: var(--dim); }

  /* Responsive */
  @media (max-width: 640px) {
    .csd-step { min-width: 90px; font-size: 10px; }
    .csd-title { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="csd-page">
  <a href="case-studies.html" class="back-link">← Toutes les études de cas</a>

  <div id="csd-content">
    <div class="csd-loading">Chargement de l'étude de cas…</div>
  </div>
</div>

<script src="js/pages/case-studies-app.js" defer></script>
</body>
</html>
