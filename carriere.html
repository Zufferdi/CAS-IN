<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>
(function(){try{var p=localStorage.getItem('cas_theme_pref');
document.documentElement.setAttribute('data-theme',p==='light'?'light':'dark');}catch(e){
document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Carrière · CAS-IN</title>
<meta name="description" content="Votre parcours de carrière · CAS-IN">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="pwa.manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@700;800&display=swap">
<link rel="stylesheet" href="style/landing.css">
<link rel="stylesheet" href="style/profile.css">
<link rel="stylesheet" href="style/gamification-toasts.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<style>
  .career-page { max-width: 760px; margin: 0 auto; padding: 18px 16px 80px; }
  .career-hero {
    text-align: center;
    padding: 22px 16px 18px;
    background: linear-gradient(135deg, rgba(255,215,100,.06), rgba(126,192,255,.06));
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
  }
  .career-hero-track {
    display: inline-block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--dim);
    margin-bottom: 8px;
  }
  .career-hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    margin: 0 0 8px;
  }
  .career-hero-current {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    background: rgba(255,215,100,.1);
    border: 1px solid rgba(255,215,100,.3);
    border-radius: 10px;
    margin-top: 10px;
  }
  .career-hero-emoji { font-size: 32px; }
  .career-hero-name { font-size: 16px; font-weight: 700; color: #ffe680; }
  .career-hero-xp {
    font-size: 11px;
    color: var(--dim);
    margin-top: 12px;
    font-family: 'Share Tech Mono', monospace;
  }
  .career-hero-progress {
    margin-top: 14px;
    max-width: 380px;
    margin-left: auto;
    margin-right: auto;
  }
  .career-hero-progress-bar {
    height: 6px;
    background: rgba(255,255,255,.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .career-hero-progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffd700, #ff9500);
    transition: width 0.5s;
  }
  .career-hero-progress-label {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    font-size: 10px;
    color: var(--dim);
    font-family: 'Share Tech Mono', monospace;
  }

  .track-switcher {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 22px;
  }
  .track-switcher-btn {
    padding: 6px 12px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04);
    color: var(--text);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .track-switcher-btn:hover { background: rgba(255,255,255,.08); }
  .track-switcher-btn.active {
    background: rgba(255,215,100,.15);
    border-color: rgba(255,215,100,.4);
    color: #ffe680;
  }
  .track-switcher-btn.is-current::after {
    content: '●';
    color: #30e88a;
    margin-left: 4px;
  }

  .career-timeline {
    position: relative;
    padding-left: 32px;
  }
  .career-timeline::before {
    content: '';
    position: absolute;
    left: 14px;
    top: 12px;
    bottom: 12px;
    width: 2px;
    background: linear-gradient(to bottom,
                rgba(48, 232, 138, 0.4) 0%,
                rgba(255, 215, 100, 0.4) 50%,
                rgba(255, 255, 255, 0.1) 100%);
  }

  .career-step {
    position: relative;
    padding: 12px 14px 14px;
    margin-bottom: 12px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 10px;
    transition: all 0.15s;
  }
  .career-step::before {
    content: '';
    position: absolute;
    left: -25px;
    top: 18px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,.15);
    border: 2px solid var(--bg, #0a0a0a);
    box-shadow: 0 0 0 2px rgba(255,255,255,.15);
  }
  .career-step.is-past::before {
    background: #30e88a;
    box-shadow: 0 0 0 2px #30e88a, 0 0 12px rgba(48,232,138,0.5);
  }
  .career-step.is-current::before {
    background: #ffd700;
    box-shadow: 0 0 0 2px #ffd700, 0 0 18px rgba(255,215,100,0.7);
    animation: career-current-pulse 2s ease-in-out infinite;
  }
  .career-step.is-current {
    background: rgba(255,215,100,.08);
    border-color: rgba(255,215,100,.35);
  }
  .career-step.is-locked {
    opacity: 0.5;
  }
  .career-step.is-locked .career-step-emoji {
    filter: grayscale(0.7);
  }

  @keyframes career-current-pulse {
    0%, 100% { box-shadow: 0 0 0 2px #ffd700, 0 0 18px rgba(255,215,100,0.7); }
    50% { box-shadow: 0 0 0 3px #ffd700, 0 0 26px rgba(255,215,100,1); }
  }

  .career-step-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .career-step-emoji { font-size: 24px; line-height: 1; }
  .career-step-info { flex: 1; min-width: 0; }
  .career-step-name {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
  }
  .career-step-meta {
    font-size: 10px;
    color: var(--dim);
    margin-top: 2px;
    font-family: 'Share Tech Mono', monospace;
  }
  .career-step-badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
  }
  .career-step-badge.past {
    background: rgba(48,232,138,.18);
    color: #30e88a;
  }
  .career-step-badge.current {
    background: rgba(255,215,100,.25);
    color: #ffe680;
  }
  .career-step-badge.locked {
    background: rgba(255,255,255,.06);
    color: var(--dim);
  }

  .career-step-flavor {
    font-size: 12px;
    color: rgba(255,255,255,.6);
    font-style: italic;
    margin-top: 8px;
    padding-left: 34px;
    line-height: 1.5;
  }

  .career-step-unlocks {
    margin-top: 10px;
    padding-left: 34px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .career-step-unlock-pill {
    background: rgba(255,215,100,.1);
    border: 1px solid rgba(255,215,100,.3);
    color: #ffe680;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--dim);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .back-link:hover { color: var(--text); }

  .reconvert-section {
    margin-top: 28px;
    padding: 18px 16px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    text-align: center;
  }
  .reconvert-section h3 {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    margin: 0 0 6px;
  }
  .reconvert-section p {
    font-size: 12px;
    color: var(--dim);
    margin: 0 0 12px;
    line-height: 1.5;
  }
  .reconvert-btn {
    background: rgba(255,180,100,.1);
    border: 1px solid rgba(255,180,100,.35);
    color: #ffb464;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .reconvert-btn:hover {
    background: rgba(255,180,100,.18);
  }

  .reconvert-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center; justify-content: center;
    z-index: 9999;
    padding: 16px;
  }
  .reconvert-modal.is-open { display: flex; }
  .reconvert-modal-card {
    background: var(--bg, #0a0a0a);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;
    padding: 20px;
    max-width: 420px;
    width: 100%;
  }
  .reconvert-modal h3 {
    margin: 0 0 12px;
    font-size: 16px;
  }
  .reconvert-track-options {
    display: grid;
    gap: 8px;
    margin-bottom: 16px;
  }
  .reconvert-track-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    font-family: inherit;
    color: var(--text);
    width: 100%;
  }
  .reconvert-track-option:hover {
    background: rgba(255,255,255,.08);
    border-color: rgba(255,255,255,.2);
  }
  .reconvert-track-option.is-current {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .reconvert-track-option-icon { font-size: 24px; }
  .reconvert-track-option-info { flex: 1; }
  .reconvert-track-option-name {
    font-size: 13px;
    font-weight: 700;
  }
  .reconvert-track-option-amb {
    font-size: 11px;
    color: var(--dim);
    margin-top: 2px;
  }
  .reconvert-warning {
    background: rgba(255,180,100,.08);
    border: 1px solid rgba(255,180,100,.25);
    border-radius: 7px;
    padding: 10px 12px;
    font-size: 11px;
    color: #ffb464;
    line-height: 1.5;
    margin-bottom: 14px;
  }
  .reconvert-modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .reconvert-modal-actions button {
    padding: 7px 14px;
    border-radius: 7px;
    border: 1px solid;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .reconvert-cancel {
    background: rgba(255,255,255,.05);
    border-color: rgba(255,255,255,.15);
    color: var(--text);
  }
</style>
</head>
<body>
<div class="career-page">
  <a href="profile.html" class="back-link">← Retour au profil</a>

  <div id="career-content">
    <div style="text-align:center;padding:40px;color:var(--dim)">Chargement…</div>
  </div>

  <!-- Axe 4 UX (v85) — Carrière par métier : un rang par rôle joué -->
  <div id="role-careers-mount"></div>
</div>

<!-- Modal de reconversion -->
<div class="reconvert-modal" id="reconvert-modal" role="dialog" aria-modal="true">
  <div class="reconvert-modal-card">
    <h3>🔄 Changer de carrière</h3>
    <div class="reconvert-warning" id="reconvert-warning">
      Reconversion : votre XP sera <strong>divisée par 2</strong>. Vous garderez votre progression mais retournerez à un rang antérieur.
    </div>
    <div class="reconvert-track-options" id="reconvert-track-options"></div>
    <div class="reconvert-modal-actions">
      <button type="button" class="reconvert-cancel" id="reconvert-cancel">Annuler</button>
    </div>
  </div>
</div>

<script src="js/core/cas-in-utils.js" defer></script>
<script src="js/core/cas-in-profile.js" defer></script>
<script src="js/core/cas-in-unlocks.js" defer></script>
<script src="js/core/cas-in-role-careers.js" defer></script>
<script src="js/profile/celebration-ui.js" defer></script>
<script src="js/profile/profile-role-careers.js" defer></script>
<script src="js/components/rank-ceremony.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Petit délai pour s'assurer que tout est chargé
  setTimeout(init, 100);
});

function init() {
  if (!window.Profile) {
    document.getElementById('career-content').innerHTML =
      '<div style="text-align:center;padding:40px;color:var(--dim)">Profil indisponible. <a href="profile.html">Retour</a>.</div>';
    return;
  }

  // Constantes TRACKS répliquées ici (lecture seule) car non exposées par Profile
  const TRACK_INFO = {
    investigator: { icon: '🕵', label: 'Enquêteur', ambiance: 'Terrain · preuves · profilage' },
    magistrate: { icon: '⚖️', label: 'Magistrat', ambiance: 'Décision · instruction · prétoire' },
    journalist: { icon: '📰', label: 'Journaliste', ambiance: 'Investigation · sources · révélation' },
    hacker: { icon: '⌨️', label: 'Hacker éthique', ambiance: 'Réseaux · pentest · zero-day' },
  };

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  // URL ?track=… pour visualiser une autre carrière sans la choisir
  function getViewedTrack() {
    const params = new URLSearchParams(window.location.search);
    return params.get('track') || (window.Profile.snapshot().agent && window.Profile.snapshot().agent.track) || 'investigator';
  }

  function render() {
    const viewedTrack = getViewedTrack();
    const snap = window.Profile.snapshot();
    const currentTrack = (snap.agent && snap.agent.track) || 'investigator';
    const isViewingCurrent = viewedTrack === currentTrack;

    const allRanks = window.Profile.getAllRanks(viewedTrack);
    if (!allRanks || !allRanks.length) {
      document.getElementById('career-content').innerHTML = '<div style="text-align:center;padding:40px;color:var(--dim)">Aucun rang trouvé pour cette track.</div>';
      return;
    }

    // Rang actuel : seulement si on visualise sa propre track
    const currentRankIdx = isViewingCurrent ? (snap.rank.idx || 0) : -1;
    const xp = snap.xp || 0;
    const xpNext = snap.rank.next ? snap.rank.next.min - xp : 0;
    const xpFromMin = xp - snap.rank.min;
    const xpInRank = snap.rank.next ? (snap.rank.next.min - snap.rank.min) : 0;
    const pctInRank = xpInRank > 0 ? Math.min(100, Math.round(xpFromMin / xpInRank * 100)) : 100;

    const trackInfo = TRACK_INFO[viewedTrack] || TRACK_INFO.investigator;

    let html = '';

    // Hero
    html += '<div class="career-hero">';
    html += '  <div class="career-hero-track">' + escapeHtml(trackInfo.icon) + ' ' + escapeHtml(trackInfo.label.toUpperCase()) + '</div>';
    html += '  <h1>' + (isViewingCurrent ? 'Votre carrière' : 'Carrière ' + escapeHtml(trackInfo.label)) + '</h1>';
    html += '  <div style="font-size:12px;color:var(--dim);margin:6px 0 0">' + escapeHtml(trackInfo.ambiance) + '</div>';

    if (isViewingCurrent) {
      const cur = snap.rank;
      html += '  <div class="career-hero-current">';
      html += '    <div class="career-hero-emoji">' + escapeHtml(cur.emoji || '⭐') + '</div>';
      html += '    <div><div class="career-hero-name">' + escapeHtml(cur.name) + '</div>';
      html += '    <div style="font-size:11px;color:var(--dim);margin-top:2px">Rang ' + (cur.idx + 1) + ' / ' + allRanks.length + '</div></div>';
      html += '  </div>';
      html += '  <div class="career-hero-xp">' + xp.toLocaleString('fr-CH') + ' XP total</div>';
      if (cur.next) {
        html += '  <div class="career-hero-progress">';
        html += '    <div class="career-hero-progress-bar"><div class="career-hero-progress-bar-fill" style="width:' + pctInRank + '%"></div></div>';
        html += '    <div class="career-hero-progress-label"><span>' + xpFromMin.toLocaleString('fr-CH') + ' XP</span><span>' + xpNext.toLocaleString('fr-CH') + ' XP → ' + escapeHtml(cur.next.name) + '</span></div>';
        html += '  </div>';
      } else {
        html += '  <div style="margin-top:14px;font-size:13px;color:#ffd700;font-weight:700">👑 Rang maximum atteint</div>';
      }
    } else {
      html += '  <div style="margin-top:14px;font-size:12px;color:var(--dim);font-style:italic">Aperçu — vous n\'êtes pas dans cette carrière</div>';
    }
    html += '</div>';

    // Track switcher
    html += '<div class="track-switcher">';
    ['investigator','magistrate','journalist','hacker'].forEach(function(k){
      const info = TRACK_INFO[k];
      const isViewed = viewedTrack === k;
      const isCurrent = currentTrack === k;
      html += '<a href="carriere.html?track=' + k + '" class="track-switcher-btn' + (isViewed ? ' active' : '') + (isCurrent ? ' is-current' : '') + '">';
      html += info.icon + ' ' + escapeHtml(info.label);
      html += '</a>';
    });
    html += '</div>';

    // Timeline
    html += '<div class="career-timeline">';
    allRanks.forEach(function(r, idx){
      let stateClass = '';
      let stateBadge = '';
      if (!isViewingCurrent) {
        stateClass = 'is-locked';
        stateBadge = '<span class="career-step-badge locked">aperçu</span>';
      } else if (idx < currentRankIdx) {
        stateClass = 'is-past';
        stateBadge = '<span class="career-step-badge past">✓ atteint</span>';
      } else if (idx === currentRankIdx) {
        stateClass = 'is-current';
        stateBadge = '<span class="career-step-badge current">en cours</span>';
      } else {
        stateClass = 'is-locked';
        stateBadge = '<span class="career-step-badge locked">à venir</span>';
      }

      const unlocks = window.Unlocks ? window.Unlocks.getUnlocksAtRank(idx) : [];
      let unlocksHtml = '';
      if (unlocks.length > 0) {
        unlocksHtml = '<div class="career-step-unlocks">';
        unlocks.forEach(function(u){
          unlocksHtml += '<span class="career-step-unlock-pill">' + escapeHtml(u.icon || '🎁') + ' ' + escapeHtml(u.shortLabel || u.title) + '</span>';
        });
        unlocksHtml += '</div>';
      }

      html += '<div class="career-step ' + stateClass + '">';
      html += '  <div class="career-step-header">';
      html += '    <div class="career-step-emoji">' + escapeHtml(r.emoji || '🎯') + '</div>';
      html += '    <div class="career-step-info">';
      html += '      <div class="career-step-name">' + escapeHtml(r.name) + '</div>';
      html += '      <div class="career-step-meta">Rang ' + (idx + 1) + ' · ' + (r.min || 0).toLocaleString('fr-CH') + ' XP</div>';
      html += '    </div>';
      html += '    ' + stateBadge;
      html += '  </div>';
      if (r.flavor) {
        html += '  <div class="career-step-flavor">« ' + escapeHtml(r.flavor) + ' »</div>';
      }
      html += unlocksHtml;
      html += '</div>';
    });
    html += '</div>';

    // Section reconversion (seulement si on visualise sa propre track)
    if (isViewingCurrent) {
      html += '<div class="reconvert-section">';
      html += '  <h3>🔄 Changer de carrière</h3>';
      html += '  <p>Vous pouvez basculer vers une autre carrière. Attention : votre XP sera divisée par 2 en pénalité de reconversion.</p>';
      html += '  <button type="button" class="reconvert-btn" id="open-reconvert">Réorienter ma carrière</button>';
      html += '</div>';
    }

    document.getElementById('career-content').innerHTML = html;

    if (isViewingCurrent) {
      const btn = document.getElementById('open-reconvert');
      if (btn) btn.addEventListener('click', openReconvertModal);
    }
  }

  function openReconvertModal() {
    const snap = window.Profile.snapshot();
    const currentTrack = (snap.agent && snap.agent.track) || 'investigator';
    const xp = snap.xp || 0;
    const xpAfter = xp >= 100 ? Math.floor(xp / 2) : xp;

    const warning = document.getElementById('reconvert-warning');
    if (xp >= 100) {
      warning.innerHTML = 'Reconversion : votre XP passera de <strong>' + xp.toLocaleString('fr-CH') + '</strong> à <strong>' + xpAfter.toLocaleString('fr-CH') + ' XP</strong> (divisée par 2). Votre rang sera ajusté en conséquence.';
    } else {
      warning.innerHTML = 'Pas de pénalité XP à ce stade (vous avez moins de 100 XP). Vous pourrez changer librement.';
    }

    const list = document.getElementById('reconvert-track-options');
    list.innerHTML = '';
    ['investigator','magistrate','journalist','hacker'].forEach(function(k){
      const info = TRACK_INFO[k];
      const isCurrent = currentTrack === k;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'reconvert-track-option' + (isCurrent ? ' is-current' : '');
      btn.disabled = isCurrent;
      btn.innerHTML =
        '<div class="reconvert-track-option-icon">' + info.icon + '</div>' +
        '<div class="reconvert-track-option-info">' +
          '<div class="reconvert-track-option-name">' + escapeHtml(info.label) + (isCurrent ? ' (actuelle)' : '') + '</div>' +
          '<div class="reconvert-track-option-amb">' + escapeHtml(info.ambiance) + '</div>' +
        '</div>';
      btn.addEventListener('click', function(){
        if (isCurrent) return;
        const result = window.Profile.reconvertTrack(k);
        if (result && result.ok) {
          closeReconvertModal();
          // Petit feedback
          if (window.Celebration && window.Celebration.show) {
            window.Celebration.show({
              icon: info.icon || '🔄',
              title: 'Reconversion effectuée',
              subtitle: 'Bienvenue en ' + info.label + (result.penalty ? ' · -' + result.xpLost.toLocaleString('fr-CH') + ' XP' : ''),
            });
          }
          setTimeout(render, 600);
        }
      });
      list.appendChild(btn);
    });

    document.getElementById('reconvert-modal').classList.add('is-open');
  }

  function closeReconvertModal() {
    document.getElementById('reconvert-modal').classList.remove('is-open');
  }

  document.getElementById('reconvert-cancel').addEventListener('click', closeReconvertModal);
  document.getElementById('reconvert-modal').addEventListener('click', function(e){
    if (e.target === e.currentTarget) closeReconvertModal();
  });

  render();

  // Re-render sur changement de profil
  if (window.Profile && window.Profile.onChange) {
    window.Profile.onChange(render);
  }
}
</script>
</body>
</html>
