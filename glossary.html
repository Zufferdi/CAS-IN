<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<title>📚 Glossaire DFIR — CAS-IN</title>
<link rel="icon" href="favicon.ico">
<link rel="manifest" href="pwa.manifest.json">
<link rel="stylesheet" href="style/style.css">
<link rel="stylesheet" href="style/scene.css">

<style>
/* ═══════════════════════════════════════════════════════════════
   Glossary page-specific styles (v2.62)
   ═══════════════════════════════════════════════════════════════ */
.gloss-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 16px 80px;
}
.gloss-header {
  text-align: center;
  margin-bottom: 24px;
  padding: 28px 16px 20px;
  background: linear-gradient(180deg, rgba(74, 158, 255, 0.08) 0%, transparent 100%);
  border-radius: 12px;
  border: 1px solid var(--border, #2a3140);
}
.gloss-header h1 {
  font-size: 26px;
  margin: 0 0 8px;
  color: var(--text, #e8eaed);
}
.gloss-header p {
  margin: 4px 0;
  color: var(--text-muted, #a8b0c0);
  font-size: 14px;
}
.gloss-stats {
  display: inline-flex;
  gap: 14px;
  margin-top: 10px;
  padding: 8px 16px;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 6px;
  font-size: 13px;
}
.gloss-stats span {
  color: var(--cyan, #4a9eff);
  font-weight: 600;
}

.gloss-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 18px;
  padding: 12px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border, #2a3140);
  border-radius: 8px;
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(8px);
}
.gloss-search {
  flex: 1 1 240px;
  min-width: 200px;
  padding: 10px 14px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--border, #2a3140);
  border-radius: 6px;
  color: var(--text, #e8eaed);
  font-size: 14px;
  font-family: inherit;
}
.gloss-search:focus {
  outline: none;
  border-color: var(--cyan, #4a9eff);
  box-shadow: 0 0 0 2px rgba(74, 158, 255, 0.15);
}
.gloss-cat-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.gloss-cat {
  padding: 5px 10px;
  background: transparent;
  border: 1px solid var(--border, #2a3140);
  border-radius: 4px;
  color: var(--text-muted, #a8b0c0);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.gloss-cat:hover {
  border-color: var(--cyan, #4a9eff);
  color: var(--text, #e8eaed);
}
.gloss-cat.active {
  background: rgba(74, 158, 255, 0.18);
  border-color: var(--cyan, #4a9eff);
  color: var(--text, #e8eaed);
}
.gloss-count {
  margin-left: 6px;
  opacity: 0.75;
  font-variant-numeric: tabular-nums;
}

.gloss-section {
  margin: 28px 0 12px;
}
.gloss-section-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text, #e8eaed);
  margin: 0 0 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border, #2a3140);
  display: flex;
  align-items: center;
  gap: 10px;
}
.gloss-section-icon {
  font-size: 22px;
}
.gloss-section-count {
  font-size: 12px;
  color: var(--text-muted, #a8b0c0);
  font-weight: 400;
  margin-left: auto;
  font-variant-numeric: tabular-nums;
}

.gloss-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}
@media (min-width: 720px) {
  .gloss-grid {
    grid-template-columns: 1fr 1fr;
  }
}
.gloss-entry {
  display: grid;
  grid-template-columns: minmax(140px, 220px) 1fr;
  gap: 12px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid var(--border, #2a3140);
  border-radius: 6px;
  transition: all 0.15s;
}
.gloss-entry:hover {
  border-color: rgba(74, 158, 255, 0.4);
  background: rgba(74, 158, 255, 0.04);
}
.gloss-entry.match {
  border-color: var(--cyan, #4a9eff);
  background: rgba(74, 158, 255, 0.08);
}
.gloss-key {
  font-weight: 600;
  color: var(--cyan, #4a9eff);
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  word-break: break-word;
  align-self: start;
}
.gloss-def {
  color: var(--text, #e8eaed);
  font-size: 13px;
  line-height: 1.45;
}
.gloss-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted, #a8b0c0);
}
.gloss-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: transparent;
  border: 1px solid var(--border, #2a3140);
  border-radius: 6px;
  color: var(--text-muted, #a8b0c0);
  text-decoration: none;
  font-size: 13px;
  margin-bottom: 16px;
  transition: all 0.15s;
}
.gloss-back:hover {
  border-color: var(--cyan, #4a9eff);
  color: var(--text, #e8eaed);
}

/* Highlight des occurrences de recherche */
.gloss-hl {
  background: rgba(255, 215, 0, 0.25);
  color: #ffd700;
  padding: 0 2px;
  border-radius: 2px;
}
</style>
<link rel="stylesheet" href="style/cas-in-navbar.css">
</head>
<body>
<div id="cas-navbar" data-page="glossary" data-no-identity="1"></div>

<div class="gloss-wrap">

  

  <header class="gloss-header">
    <h1>📚 Glossaire DFIR</h1>
    <p>Articles légaux, jurisprudence, normes et termes techniques utilisés dans les scénarios.</p>
    <div class="gloss-stats">
      <span id="stat-total">…</span> entrées
      <span>·</span>
      <span id="stat-shown">…</span> affichées
    </div>
  </header>

  <div class="gloss-toolbar">
    <input type="search" class="gloss-search" id="gloss-search"
           placeholder="🔎 Rechercher (mot, article, loi, ATF…)"
           autocomplete="off" autofocus>
    <div class="gloss-cat-chips" id="gloss-cats"></div>
  </div>

  <main id="gloss-content">
    <div class="gloss-empty">Chargement du glossaire…</div>
  </main>

</div>

<!-- Charge le profil pour rester sur le SW + le bandeau utilisateur -->
<script src="js/core/cas-in-profile.js" defer></script>

<script>
// ═══════════════════════════════════════════════════════════════
// glossary-page.js — v2.62
// Lit GLOSSARY depuis scene-app.js (chargé en différé) et l'affiche.
// Catégorisation par préfixe + recherche live + highlight.
// ═══════════════════════════════════════════════════════════════

// Categorisation
const CATEGORIES = [
  { id: 'all',      label: 'Tout',                icon: '📚', match: () => true },
  { id: 'cpp',      label: 'CPP',                 icon: '⚖️', match: k => /^Art\. [\d\w]+ CPP/i.test(k) || /^CPP\b/.test(k) || /^Code de procédure pénale/i.test(k) },
  { id: 'cp',       label: 'Code pénal',          icon: '📕', match: k => /^Art\. [\d\w]+ CP\b/i.test(k) || /^art\. \d+/.test(k) },
  { id: 'cst',      label: 'Constitution',        icon: '🏛️', match: k => /Cst\./i.test(k) },
  { id: 'lpd',      label: 'LPD / RGPD',          icon: '🔒', match: k => /\bLPD\b/.test(k) || /\bnLPD\b/.test(k) || /^RGPD/.test(k) },
  { id: 'lba',      label: 'LBA / banques',       icon: '🏦', match: k => /\bLBA\b/.test(k) || /\bLB\b/.test(k) || /Convention LCB/.test(k) },
  { id: 'eimp',     label: 'EIMP / entraide',     icon: '🌍', match: k => /\bEIMP\b/.test(k) || /MLAT/.test(k) || /Convention européenne d.entraide/.test(k) || /\bCEEJ\b/.test(k) },
  { id: 'atf',      label: 'Jurisprudence',       icon: '📖', match: k => /^ATF\b/.test(k) || /^TF \d/.test(k) || /^Doctrine\b/.test(k) || /^CrEDH\b/.test(k) },
  { id: 'cyber',    label: 'Cyber EU',            icon: '🇪🇺', match: k => /\bAI Act\b/.test(k) || /\bNIS2\b/.test(k) || /\bDORA\b/.test(k) || /\bCRA\b/.test(k) || /\bCER\b/.test(k) || /\bENISA\b/.test(k) || /\bENTSO/.test(k) },
  { id: 'inst',     label: 'Institutions',        icon: '🏢', match: k => /^(MROS|fedpol|FedPol|MPC|MELANI|GovCERT|FINMA|TMC|MP|OFCS|SRC|PFPDT|SECO|SwissPost|RTS|Swissgrid|FATF|GAFI|Eurojust|Europol|Interpol|FinCEN|TRACFIN|FIU|Egmont|OFDF|AFD|DélCdG|CCPF|CDF|FedPol|AI Office)\b/.test(k) },
  { id: 'std',      label: 'Standards / outils',  icon: '🛠️', match: k => /^(NIST|ISO|IEC|ACPO|MITRE|STIX|Encase|FTK|Autopsy|Sleuth|Wireshark|tcpdump|Cellebrite|GrayKey|Magnet|Hashcat|John|BIP-39|Tor|VPN|I2P|Maltego|Shodan|Censys|BitLocker|VeraCrypt|Cobalt|Tails|Volatility|YARA|Chainalysis|COBIT|SOC|ISAE|CIS Controls|IEC 62443|CVE)/i.test(k) },
  { id: 'conv',     label: 'Conventions',         icon: '📜', match: k => /^Convention\b/.test(k) || /^Accord\b/.test(k) || /CEDH/.test(k) || /^Traité/.test(k) || /CLOUD Act/.test(k) || /Schengen/.test(k) },
];

let GLOSSARY_DATA = {};
let activeCat = 'all';
let searchTerm = '';

function loadGlossary() {
  // Le glossaire est dans scene-app.js. On le charge dynamiquement et
  // on extrait l'objet GLOSSARY exposé en global.
  const s = document.createElement('script');
  s.src = 'js/pages/scene-app.js';
  s.onload = () => {
    if (typeof GLOSSARY !== 'undefined') {
      GLOSSARY_DATA = GLOSSARY;
      init();
    } else {
      document.getElementById('gloss-content').innerHTML =
        '<div class="gloss-empty">⚠️ Impossible de charger le glossaire (variable GLOSSARY introuvable).</div>';
    }
  };
  s.onerror = () => {
    document.getElementById('gloss-content').innerHTML =
      '<div class="gloss-empty">⚠️ Échec de chargement de scene-app.js.</div>';
  };
  document.head.appendChild(s);
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, ch => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]
  ));
}

function highlight(text, term) {
  if (!term) return escapeHTML(text);
  const escaped = escapeHTML(text);
  const safeTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${safeTerm})`, 'gi');
  return escaped.replace(re, '<span class="gloss-hl">$1</span>');
}

function categorize(key) {
  for (const c of CATEGORIES) {
    if (c.id === 'all') continue;
    if (c.match(key)) return c;
  }
  return { id: 'other', label: 'Autres', icon: '📝' };
}

function renderCategoryChips() {
  const container = document.getElementById('gloss-cats');
  // Compter par catégorie
  const counts = {};
  Object.keys(GLOSSARY_DATA).forEach(k => {
    const c = categorize(k);
    counts[c.id] = (counts[c.id] || 0) + 1;
  });
  counts.all = Object.keys(GLOSSARY_DATA).length;

  container.innerHTML = CATEGORIES.map(c => {
    const n = counts[c.id] || 0;
    if (n === 0 && c.id !== 'all') return '';
    return `<button class="gloss-cat ${c.id === activeCat ? 'active' : ''}"
                    data-cat="${c.id}"
                    aria-label="Filtrer ${c.label}">
              ${c.icon} ${c.label}
              <span class="gloss-count">${n}</span>
            </button>`;
  }).join('');

  container.querySelectorAll('.gloss-cat').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCat = btn.dataset.cat;
      renderCategoryChips();
      renderGlossary();
    });
  });
}

function renderGlossary() {
  const container = document.getElementById('gloss-content');
  const allKeys = Object.keys(GLOSSARY_DATA).sort();

  // Filtrage
  const term = searchTerm.toLowerCase().trim();
  const filtered = allKeys.filter(k => {
    // Catégorie
    if (activeCat !== 'all') {
      const c = categorize(k);
      if (c.id !== activeCat) return false;
    }
    // Recherche
    if (term) {
      const haystack = (k + ' ' + GLOSSARY_DATA[k]).toLowerCase();
      if (!haystack.includes(term)) return false;
    }
    return true;
  });

  document.getElementById('stat-total').textContent = allKeys.length;
  document.getElementById('stat-shown').textContent = filtered.length;

  if (filtered.length === 0) {
    container.innerHTML = '<div class="gloss-empty">Aucune entrée ne correspond.</div>';
    return;
  }

  // Grouper par catégorie
  const groups = {};
  filtered.forEach(k => {
    const c = categorize(k);
    if (!groups[c.id]) groups[c.id] = { cat: c, items: [] };
    groups[c.id].items.push(k);
  });

  // Ordre = celui de CATEGORIES + 'other' à la fin
  const ordered = CATEGORIES.filter(c => c.id !== 'all' && groups[c.id]).concat(
    groups['other'] ? [{ id: 'other', label: 'Autres', icon: '📝' }] : []
  );

  let html = '';
  ordered.forEach(cat => {
    const g = groups[cat.id];
    if (!g) return;
    html += `
      <div class="gloss-section">
        <h2 class="gloss-section-title">
          <span class="gloss-section-icon">${cat.icon}</span>
          ${cat.label}
          <span class="gloss-section-count">${g.items.length}</span>
        </h2>
        <div class="gloss-grid">
          ${g.items.map(k => `
            <div class="gloss-entry ${term && k.toLowerCase().includes(term) ? 'match' : ''}">
              <div class="gloss-key">${highlight(k, term)}</div>
              <div class="gloss-def">${highlight(GLOSSARY_DATA[k], term)}</div>
            </div>
          `).join('')}
        </div>
      </div>`;
  });

  container.innerHTML = html;
}

function init() {
  renderCategoryChips();
  renderGlossary();

  const search = document.getElementById('gloss-search');
  search.addEventListener('input', e => {
    searchTerm = e.target.value;
    renderGlossary();
  });

  // Esc pour vider
  search.addEventListener('keydown', e => {
    if (e.key === 'Escape' && search.value) {
      search.value = '';
      searchTerm = '';
      renderGlossary();
    }
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', loadGlossary);
} else {
  loadGlossary();
}
</script>
<script src="js/core/cas-in-navbar.js" defer></script>
</body>
</html>
