name: Sync fiches index

on:
  push:
    paths:
      - 'fiches/**.html'
  workflow_dispatch:

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml

      - name: Generate index.html
        run: python .github/scripts/build_index.py

      - name: Commit updated index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fiches/index.html
          git diff --cached --quiet || git commit -m "chore: sync fiches/index.html [bot]"
          git push
