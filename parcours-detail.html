<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>
(function(){try{var p=localStorage.getItem('cas_theme_pref');
document.documentElement.setAttribute('data-theme',p==='light'?'light':'dark');}catch(e){
document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Parcours détail · CAS-IN</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="pwa.manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@700;800&display=swap">
<link rel="stylesheet" href="style/landing.css">
<link rel="stylesheet" href="style/profile.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛤️</text></svg>">
<style>
  .detail-page { max-width: 900px; margin: 0 auto; padding: 18px 16px 80px; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--dim);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .back-link:hover { color: var(--text); }
  .detail-hero {
    background: linear-gradient(135deg, rgba(126,192,255,.06), rgba(48,232,138,.06));
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;
    padding: 22px 22px;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
  }
  .detail-hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--hero-color, #7ec0ff);
  }
  .detail-hero-icon { font-size: 48px; }
  .detail-hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    margin: 6px 0 8px;
  }
  .detail-hero-desc { color: var(--dim); font-size: 14px; line-height: 1.6; }
  .detail-hero-meta {
    display: flex; gap: 10px; flex-wrap: wrap;
    font-size: 12px; color: var(--dim);
    margin-top: 14px;
  }
  .detail-hero-meta span {
    background: rgba(255,255,255,.06);
    padding: 4px 10px; border-radius: 5px;
  }
  .global-progress {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .global-progress-bar {
    height: 8px; background: rgba(255,255,255,.08);
    border-radius: 4px; overflow: hidden;
  }
  .global-progress-bar-fill {
    height: 100%; background: var(--hero-color, #7ec0ff);
    transition: width 0.5s;
  }
  .step-card {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 18px 18px 16px;
    margin-bottom: 14px;
    transition: all 0.15s;
  }
  .step-card.completed {
    background: rgba(48,232,138,.06);
    border-color: rgba(48,232,138,.25);
  }
  .step-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 8px;
  }
  .step-number {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(126,192,255,.18);
    border: 1px solid rgba(126,192,255,.4);
    color: #7ec0ff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
    flex-shrink: 0;
  }
  .step-card.completed .step-number {
    background: rgba(48,232,138,.18);
    border-color: rgba(48,232,138,.4);
    color: var(--text-ok);
  }
  .step-title {
    font-size: 16px; font-weight: 700; flex: 1;
  }
  .step-toggle {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12);
    color: var(--text);
    padding: 5px 11px; border-radius: 6px;
    font-size: 11px; cursor: pointer;
    transition: all 0.15s;
  }
  .step-toggle:hover { background: rgba(255,255,255,.1); }
  .step-toggle.done {
    background: rgba(48,232,138,.18);
    border-color: rgba(48,232,138,.4);
    color: var(--text-ok);
  }
  .step-desc {
    color: var(--dim);
    font-size: 12px;
    line-height: 1.55;
    margin-bottom: 14px;
    padding-left: 44px;
  }
  .step-resources {
    padding-left: 44px;
  }
  .resource-group { margin-bottom: 10px; }
  .resource-group-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--dim);
    margin-bottom: 6px;
    font-weight: 700;
  }
  .resource-links {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .resource-link {
    text-decoration: none;
    padding: 5px 11px;
    border-radius: 6px;
    font-size: 12px;
    border: 1px solid;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .resource-link-fiche {
    background: rgba(126,192,255,.08);
    border-color: rgba(126,192,255,.3);
    color: #7ec0ff;
  }
  .resource-link-fiche:hover { background: rgba(126,192,255,.18); }
  .resource-link-quiz {
    background: rgba(255,204,64,.08);
    border-color: rgba(255,204,64,.3);
    color: #ffcc40;
  }
  .resource-link-quiz:hover { background: rgba(255,204,64,.18); }
  .resource-link-scene {
    background: rgba(255,126,182,.08);
    border-color: rgba(255,126,182,.3);
    color: #ff7eb6;
  }
  .resource-link-scene:hover { background: rgba(255,126,182,.18); }
  .mastery-badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 4px;
    background: rgba(255,255,255,.06);
  }
  .loading {
    text-align: center; padding: 30px;
    color: var(--dim);
  }
  @media (max-width: 600px) {
    .step-desc, .step-resources { padding-left: 0; margin-top: 8px; }
    .step-header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="detail-page">
  <a href="parcours.html" class="back-link">← Retour aux parcours</a>

  <div id="detail-content">
    <div class="loading">Chargement…</div>
  </div>
</div>

<script src="js/core/cas-in-mastery-quiz.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
  function lsGet(k,fb){try{var r=localStorage.getItem(k);return r===null?fb:JSON.parse(r);}catch(e){return fb;}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

  // Récupérer ID du parcours depuis URL
  var urlParams = new URLSearchParams(window.location.search);
  var parcoursId = urlParams.get('id');
  if (!parcoursId) {
    document.getElementById('detail-content').innerHTML = '<div class="loading">Aucun parcours spécifié. <a href="parcours.html">Retour à la liste</a>.</div>';
    return;
  }

  // Charger parcours + titres fiches en parallèle
  Promise.all([
    fetch('data/parcours.json').then(function(r){return r.json();}),
    fetch('data/fiches-titles.json').then(function(r){return r.json();}).catch(function(){return {};})
  ]).then(function(results){
    var parcours = results[0];
    var fichesTitles = results[1];
    var p = parcours.find(function(x){return x.id === parcoursId;});
    if (!p) {
      document.getElementById('detail-content').innerHTML = '<div class="loading">Parcours introuvable. <a href="parcours.html">Retour à la liste</a>.</div>';
      return;
    }
    document.title = p.title + ' · CAS-IN';
    renderParcours(p, fichesTitles);
  }).catch(function(err){
    console.error(err);
    document.getElementById('detail-content').innerHTML = '<div class="loading">Erreur de chargement. <a href="parcours.html">Retour</a>.</div>';
  });

  function renderParcours(p, fichesTitles) {
    var progressKey = 'parcoursProgress';
    var allProgress = lsGet(progressKey, {}) || {};
    var prog = allProgress[p.id] || { stepsCompleted: [] };
    var stepsDone = prog.stepsCompleted || [];

    var totalSteps = p.steps.length;
    var pct = totalSteps > 0 ? Math.round(stepsDone.length / totalSteps * 100) : 0;

    var html = '';

    // HERO
    html += '<div class="detail-hero" style="--hero-color:' + p.color + '">';
    html += '  <div class="detail-hero-icon">' + (p.icon || '📖') + '</div>';
    html += '  <h1>' + escapeHtml(p.title) + '</h1>';
    html += '  <div class="detail-hero-desc">' + escapeHtml(p.description) + '</div>';
    html += '  <div class="detail-hero-meta">';
    html += '    <span>📚 ' + totalSteps + ' étapes</span>';
    html += '    <span>📊 ' + escapeHtml(p.difficulty || '') + '</span>';
    html += '    <span>⏱ ' + escapeHtml(p.duration_estimate || '?') + '</span>';
    html += '  </div>';
    html += '  <div class="global-progress">';
    html += '    <div class="global-progress-bar"><div class="global-progress-bar-fill" style="width:' + pct + '%"></div></div>';
    html += '    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--dim)">';
    html += '      <span>' + stepsDone.length + ' / ' + totalSteps + ' étapes complétées</span>';
    html += '      <span>' + pct + '%</span>';
    html += '    </div>';
    html += '  </div>';
    html += '</div>';

    // ÉTAPES
    p.steps.forEach(function(step, idx) {
      var done = stepsDone.indexOf(step.id) !== -1;
      html += '<div class="step-card' + (done ? ' completed' : '') + '" data-step-id="' + escapeHtml(step.id) + '">';
      html += '  <div class="step-header">';
      html += '    <div class="step-number">' + (done ? '✓' : (idx + 1)) + '</div>';
      html += '    <div class="step-title">' + escapeHtml(step.title) + '</div>';
      html += '    <button class="step-toggle' + (done ? ' done' : '') + '" data-step-id="' + escapeHtml(step.id) + '">';
      html += (done ? '✓ Complétée' : 'Marquer comme faite');
      html += '    </button>';
      html += '  </div>';
      html += '  <div class="step-desc">' + escapeHtml(step.description) + '</div>';
      html += '  <div class="step-resources">';

      // FICHES
      if (step.fiches && step.fiches.length) {
        html += '<div class="resource-group">';
        html += '  <div class="resource-group-label">📖 Fiches</div>';
        html += '  <div class="resource-links">';
        step.fiches.forEach(function(slug){
          var safe = String(slug).replace(/[^a-zA-Z0-9_-]/g, '');
          if (!safe) return;
          var title = fichesTitles[safe] || safe.replace(/_/g, ' ');
          html += '<a href="fiches/' + safe + '.html" target="_blank" rel="noopener" class="resource-link resource-link-fiche">' + escapeHtml(title) + '</a>';
        });
        html += '  </div>';
        html += '</div>';
      }

      // QUIZ (avec mastery score si dispo)
      if (step.chapters_quiz && step.chapters_quiz.length) {
        html += '<div class="resource-group">';
        html += '  <div class="resource-group-label">🎯 Quiz ciblés</div>';
        html += '  <div class="resource-links">';
        step.chapters_quiz.forEach(function(chapter){
          var masteryBadge = '';
          if (window.MasteryQuiz) {
            var m = window.MasteryQuiz.computeMastery(chapter);
            if (m.tier !== 'untouched') {
              masteryBadge = '<span class="mastery-badge" style="color:' + window.MasteryQuiz.tierColor(m.tier) + '">' + window.MasteryQuiz.tierEmoji(m.tier) + ' ' + m.score + '%</span>';
            }
          }
          // Lien vers quiz.html avec filtre chapitre via query string
          html += '<a href="quiz.html?chapter=' + encodeURIComponent(chapter) + '" target="_blank" rel="noopener" class="resource-link resource-link-quiz">' + escapeHtml(chapter) + masteryBadge + '</a>';
        });
        html += '  </div>';
        html += '</div>';
      }

      // SCÈNES
      if (step.scenes && step.scenes.length) {
        html += '<div class="resource-group">';
        html += '  <div class="resource-group-label">🎬 Études de cas</div>';
        html += '  <div class="resource-links">';
        step.scenes.forEach(function(sceneId){
          var safe = String(sceneId).replace(/[^a-zA-Z0-9_-]/g, '');
          if (!safe) return;
          html += '<a href="scene.html?id=' + encodeURIComponent(safe) + '" target="_blank" rel="noopener" class="resource-link resource-link-scene">' + escapeHtml(safe.replace(/-/g, ' ')) + '</a>';
        });
        html += '  </div>';
        html += '</div>';
      }

      html += '  </div>';
      html += '</div>';
    });

    document.getElementById('detail-content').innerHTML = html;

    // Handlers toggle
    document.querySelectorAll('.step-toggle').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault();
        var stepId = btn.dataset.stepId;
        var allProgress = lsGet(progressKey, {}) || {};
        var prog = allProgress[p.id] || { stepsCompleted: [] };
        var idx = prog.stepsCompleted.indexOf(stepId);
        if (idx === -1) {
          prog.stepsCompleted.push(stepId);
        } else {
          prog.stepsCompleted.splice(idx, 1);
        }
        allProgress[p.id] = prog;
        lsSet(progressKey, allProgress);
        renderParcours(p, fichesTitles); // re-render
      });
    });
  }
});
</script>
</body>
</html>
