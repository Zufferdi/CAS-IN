<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>
(function(){try{var p=localStorage.getItem('cas_theme_pref');
document.documentElement.setAttribute('data-theme',p==='light'?'light':'dark');}catch(e){
document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sagas · CAS-IN</title>
<meta name="description" content="Les 25 sagas narratives de CAS-IN — affaires multi-actes avec progression individuelle">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="pwa.manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@700;800&display=swap">
<link rel="stylesheet" href="style/landing.css">
<link rel="stylesheet" href="style/profile.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
  .sg-page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 16px 80px;
  }
  .sg-hero {
    text-align: center;
    padding: 22px 16px 18px;
    background: linear-gradient(135deg, rgba(126,192,255,.06), rgba(201,125,245,.04));
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;
    margin-bottom: 24px;
  }
  .sg-hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    margin: 0 0 6px;
  }
  .sg-hero p {
    color: var(--dim, #6a80a8);
    font-size: 13px;
    max-width: 680px;
    margin: 0 auto;
  }
  .sg-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin: 14px auto 0;
    max-width: 720px;
  }
  .sg-summary-cell {
    text-align: center;
    padding: 8px 6px;
    background: rgba(255,255,255,.04);
    border-radius: 8px;
  }
  .sg-summary-num {
    font-family: 'JetBrains Mono', 'Share Tech Mono', monospace;
    font-size: 20px; font-weight: 700;
    color: var(--text, #ccd8f0);
    display: block;
  }
  .sg-summary-lbl {
    font-size: 10px;
    color: var(--dim, #6a80a8);
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.7px;
    text-transform: uppercase;
  }

  /* Level filter chips */
  .sg-filters {
    display: flex; justify-content: center; flex-wrap: wrap;
    gap: 8px; margin: 0 0 22px;
  }
  .sg-chip {
    background: var(--surface2, #111d35);
    border: 1px solid var(--border, #1e3058);
    color: var(--text, #ccd8f0);
    padding: 6px 12px;
    border-radius: 14px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    transition: all .15s;
  }
  .sg-chip:hover { background: rgba(0,229,204,.1); border-color: var(--cyan, #00e5cc); }
  .sg-chip.active {
    background: var(--cyan, #00e5cc); color: #08101c; border-color: var(--cyan, #00e5cc);
    font-weight: 700;
  }
  .sg-chip-count {
    margin-left: 6px;
    font-size: 10px;
    opacity: .7;
  }

  /* Mosaic */
  .sg-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
  }
  .sg-card {
    background: var(--surface, #0d1526);
    border: 1px solid var(--border, #1e3058);
    border-radius: 12px;
    padding: 14px 16px 12px;
    display: flex; flex-direction: column; gap: 8px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: all .18s ease;
    position: relative;
    overflow: hidden;
  }
  .sg-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--sg-color, var(--cyan, #00e5cc));
    transition: width .15s;
  }
  .sg-card:hover {
    transform: translateY(-2px);
    border-color: var(--sg-color, var(--cyan, #00e5cc));
  }
  .sg-card:hover::before { width: 5px; }
  .sg-card.completed {
    border-color: rgba(48,232,138,.4);
  }
  .sg-card.completed::before {
    background: var(--green, #30e88a);
  }

  .sg-card-head {
    display: flex; align-items: flex-start; gap: 10px;
  }
  .sg-card-icon {
    font-size: 28px; line-height: 1; flex-shrink: 0;
    font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', system-ui, sans-serif;
  }
  .sg-card-titles {
    flex: 1; min-width: 0;
  }
  .sg-card-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 2px;
    color: var(--text, #ccd8f0);
    line-height: 1.25;
  }
  .sg-card-sub {
    font-size: 11px;
    color: var(--dim, #6a80a8);
    line-height: 1.35;
    font-family: 'Share Tech Mono', monospace;
  }
  .sg-card-level {
    flex-shrink: 0;
    font-size: 9px;
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 8px;
    background: var(--surface2, #111d35);
    border: 1px solid var(--border, #1e3058);
  }
  .sg-card-level[data-level="stagiaire"]  { color: var(--green, #30e88a); border-color: rgba(48,232,138,.3); }
  .sg-card-level[data-level="inspecteur"] { color: var(--gold, #f0c040);  border-color: rgba(240,192,64,.3); }
  .sg-card-level[data-level="enqueteur"]  { color: var(--red, #ff4060);   border-color: rgba(255,64,96,.3); }
  .sg-card-level[data-level="expert"]     { color: var(--purple, #c97df5);border-color: rgba(201,125,245,.3); }
  /* aliases génériques fallback */
  .sg-card-level[data-level="easy"]   { color: var(--green, #30e88a); border-color: rgba(48,232,138,.3); }
  .sg-card-level[data-level="medium"] { color: var(--gold, #f0c040);  border-color: rgba(240,192,64,.3); }
  .sg-card-level[data-level="hard"]   { color: var(--red, #ff4060);   border-color: rgba(255,64,96,.3); }

  .sg-card-desc {
    font-size: 12px;
    color: var(--dim, #6a80a8);
    line-height: 1.5;
    max-height: 64px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }

  .sg-card-progress {
    margin-top: 4px;
  }
  .sg-card-prog-line {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    margin-bottom: 5px;
  }
  .sg-card-prog-num {
    color: var(--sg-color, var(--cyan, #00e5cc));
    font-weight: 700;
  }
  .sg-card-prog-pct {
    color: var(--dim, #6a80a8);
    font-size: 10px;
  }
  .sg-card-bar {
    height: 6px;
    background: var(--surface2, #111d35);
    border-radius: 4px;
    overflow: hidden;
  }
  .sg-card-bar-fill {
    height: 100%;
    background: var(--sg-color, var(--cyan, #00e5cc));
    border-radius: 4px;
    transition: width .6s ease;
  }
  .sg-card.completed .sg-card-bar-fill { background: var(--green, #30e88a); }

  .sg-card-cta {
    margin-top: 6px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px;
    color: var(--dim, #6a80a8);
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.5px;
  }
  .sg-card-cta-act {
    color: var(--sg-color, var(--cyan, #00e5cc));
    font-weight: 700;
  }
  .sg-card.completed .sg-card-cta-act { color: var(--green, #30e88a); }

  .sg-back-link {
    display: inline-block;
    color: var(--dim, #6a80a8);
    text-decoration: none;
    font-size: 12px;
    margin-bottom: 14px;
    font-family: 'Share Tech Mono', monospace;
  }
  .sg-back-link:hover { color: var(--cyan, #00e5cc); }

  @media (max-width: 540px) {
    .sg-summary { grid-template-columns: repeat(2, 1fr); }
    .sg-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="sg-page">
  <a href="profile.html" class="sg-back-link">← Retour au profil</a>

  <div class="sg-hero">
    <h1>📖 Sagas narratives</h1>
    <p>25 affaires multi-actes vous emmènent à travers la cybercriminalité suisse, du Léman au Tessin. Chaque saga raconte une enquête en 5 à 8 scènes — choisissez votre prochaine.</p>
    <div class="sg-summary" id="sg-summary">
      <div class="sg-summary-cell"><span class="sg-summary-num" id="sg-total-sagas">25</span><span class="sg-summary-lbl">Sagas</span></div>
      <div class="sg-summary-cell"><span class="sg-summary-num" id="sg-total-scenes">—</span><span class="sg-summary-lbl">Scènes au total</span></div>
      <div class="sg-summary-cell"><span class="sg-summary-num" id="sg-completed-scenes">—</span><span class="sg-summary-lbl">Vos scènes</span></div>
      <div class="sg-summary-cell"><span class="sg-summary-num" id="sg-completed-sagas">—</span><span class="sg-summary-lbl">Sagas finies</span></div>
    </div>
  </div>

  <div class="sg-filters" id="sg-filters">
    <button class="sg-chip active" data-level="all">Toutes <span class="sg-chip-count" id="sg-count-all">25</span></button>
    <button class="sg-chip" data-level="stagiaire">Stagiaire <span class="sg-chip-count" id="sg-count-stagiaire">—</span></button>
    <button class="sg-chip" data-level="inspecteur">Inspecteur <span class="sg-chip-count" id="sg-count-inspecteur">—</span></button>
    <button class="sg-chip" data-level="enqueteur">Enquêteur <span class="sg-chip-count" id="sg-count-enqueteur">—</span></button>
    <button class="sg-chip" data-level="expert">Expert <span class="sg-chip-count" id="sg-count-expert">—</span></button>
  </div>

  <div class="sg-grid" id="sg-grid">
    <div style="text-align:center;padding:40px;color:var(--dim);grid-column:1/-1">Chargement…</div>
  </div>
</div>

<script src="js/core/cas-in-utils.js" defer></script>
<script src="js/core/cas-in-theme-toggle.js" defer></script>
<script src="js/pages/sagas-app.js" defer></script>
</body>
</html>
