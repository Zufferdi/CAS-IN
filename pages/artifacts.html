<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">

<script>
/* v2.92 — Applique la préférence manuelle clair/sombre AVANT le rendu CSS
   pour éviter le flash de thème inverse. Défaut = sombre (data-theme="dark"). */
(function(){try{var p=localStorage.getItem('cas_theme_pref');
document.documentElement.setAttribute('data-theme',p==='light'?'light':'dark');}catch(e){
document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artefacts Forensiques — Aide-mémoire · CAS-IN</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂</text></svg>">
<meta name="description" content="Aide-mémoire interactif : artefacts forensiques Windows (XP→11), macOS, Linux. Recherche, filtres OS/catégorie/version, détails dépliables. Indique le fichier ou la ruche à ouvrir en premier en analyse dead-box.">
<link rel="canonical" href="https://zufferdi.github.io/CAS-IN/pages/artifacts.html">
<meta property="og:title" content="Artefacts Forensiques · CAS-IN">
<meta property="og:description" content="Aide-mémoire interactif : où chercher quoi sur Windows, macOS, Linux. 96 artefacts avec source, chemin, versions, notes d'enquête.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zufferdi.github.io/CAS-IN/artifacts.html">
<meta property="og:image" content="https://zufferdi.github.io/CAS-IN/og-image.svg">
<meta property="og:site_name" content="CAS-IN · Investigation Numérique">
<meta property="og:locale" content="fr_CH">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Artefacts Forensiques · CAS-IN">
<meta name="twitter:description" content="Aide-mémoire DFIR : Windows / macOS / Linux. Filtres, recherche, détails dépliables.">
<meta name="twitter:image" content="https://zufferdi.github.io/CAS-IN/og-image.svg">
<link rel="stylesheet" href="../style/fiche_style.css">
<link rel="stylesheet" href="../style/artifacts.css">
<link rel="stylesheet" href="../style/cas-in-navbar.css">
</head>
<body>
<div id="cas-navbar" data-page="artifacts" data-no-identity="1"></div>

<div class="art-page">

  <div class="hero">
    <div class="hero-eye">🗂 Référence DFIR</div>
    <h1>Artefacts Forensiques</h1>
    <p>Windows XP → 11 · macOS · Linux — où chercher quoi, dans quel fichier ou ruche</p>
    <div class="art-cross-link">
      Besoin d'un calculateur (timestamps, MFT, FAT, magic bytes…) ?
      → <a href="tools.html">Outils Forensiques 🛠</a>
    </div>
  </div>

  <div class="art-filters">
    <div>
      <label for="f-os">Système d'exploitation</label>
      <select id="f-os">
        <option value="">Tous</option>
        <option value="Windows">Windows</option>
        <option value="Mac">macOS</option>
        <option value="Linux">Linux</option>
      </select>
    </div>
    <div style="display:none">
      <label for="f-src">Source / Fichier</label>
      <select id="f-src"><option value="">Toutes</option></select>
    </div>
    <div>
      <label for="f-cat">Catégorie</label>
      <select id="f-cat"><option value="">Toutes</option></select>
    </div>
    <div>
      <label for="f-ver">Version Windows</label>
      <select id="f-ver">
        <option value="">Toutes</option>
        <option value="XP">XP</option>
        <option value="Vista">Vista</option>
        <option value="7">7</option>
        <option value="8">8 / 8.1</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="NT">NT / 2000</option>
        <option value="9x">95 / 98 / Me</option>
      </select>
    </div>
    <div>
      <label for="f-q">Recherche libre</label>
      <input type="text" id="f-q" placeholder="ex: USB, mot de passe, prefetch…">
    </div>
    <div class="art-stats">
      <span id="art-count"></span>
      <button type="button" onclick="resetFilters()">Reset</button>
      <button type="button" onclick="expandAll()">Tout déplier</button>
      <button type="button" onclick="collapseAll()">Tout replier</button>
    </div>
  </div>

  <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
  <table class="art-table" id="art-tbl">
    <thead>
      <tr>
        <th data-k="os">OS <span class="arrow">▼▲</span></th>
        <th data-k="source">Source <span class="arrow">▼▲</span></th>
        <th data-k="category">Catégorie <span class="arrow">▼▲</span></th>
        <th data-k="name">Artefact <span class="arrow">▼▲</span></th>
        <th>Chemin / Sous-clé</th>
        <th>Versions</th>
      </tr>
    </thead>
    <tbody id="art-tbody"></tbody>
  </table>
  </div>

</div>

<script src="../js/pages/artifacts-data.js" defer></script>
<script src="../js/pages/artifacts-app.js" defer></script>
<script src="../js/components/fiche-search.js" defer></script>
<script src="../js/components/search-modal.js" defer></script>
<script src="../js/core/cas-in-theme-toggle.js" defer></script>
<script src="../js/core/cas-in-navbar.js" defer></script>
</body>
</html>
