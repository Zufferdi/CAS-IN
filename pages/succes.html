<html lang="fr">
<head>
<meta charset="UTF-8">

document.documentElement.setAttribute('data-theme',p==='light'?'light':'dark');}catch(e){
document.documentElement.setAttribute('data-theme','dark');}})();

<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Succès · CAS-IN</title>
<meta name="description" content="Vos 148 trophées débloquables en 7 catégories visuelles · CAS-IN">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="https://zufferdi.github.io/CAS-IN/pages/succes.html">
<meta property="og:title" content="Succès · CAS-IN">
<meta property="og:description" content="148 trophées débloquables en 7 catégories visuelles">
<meta property="og:type" content="website">
<link rel="manifest" href="../pwa.manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@700;800&display=swap">
<link rel="stylesheet" href="../style/landing.css">
<link rel="stylesheet" href="../style/profile.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<style>
  .suc-page { max-width: 1180px; margin: 0 auto; padding: 18px 16px 80px; }
  .suc-back {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--dim); text-decoration: none;
    font-size: 14px; margin-bottom: 16px;
    padding: 8px 14px; border-radius: 10px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    transition: all .18s;
  }
  .suc-back:hover {
    background: rgba(255,255,255,.07);
    color: var(--text);
  }

  /* ── Sommaire global ── */
  .suc-summary {
    background: linear-gradient(135deg, rgba(245,158,11,.12), rgba(168,85,247,.10));
    border: 1px solid rgba(245,158,11,.30);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 22px;
    text-align: center;
  }
  .suc-summary-count {
    font-family: 'Syne', sans-serif;
    font-size: 2.2rem;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 6px;
  }
  .suc-summary-count .total {
    color: var(--dim);
    font-size: 1.4rem;
    font-weight: 400;
  }
  .suc-summary-percent {
    font-size: .9rem;
    color: #fbbf24;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .suc-summary-xp {
    font-size: .85rem;
    color: var(--dim);
  }
  .suc-summary-tier-row {
    display: flex; gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .suc-tier-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: .8rem;
    color: var(--dim);
  }
  .suc-tier-pill .num { font-weight: 700; color: var(--text); }

  /* ── Prochains déblocages ── */
  .suc-next {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 22px;
  }
  .suc-next-label {
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--dim);
    font-weight: 700;
    margin-bottom: 12px;
  }
  .suc-next-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0;
    border-top: 1px solid rgba(255,255,255,.04);
  }
  .suc-next-item:first-of-type { border-top: none; padding-top: 0; }
  .suc-next-icon {
    font-size: 24px;
    flex-shrink: 0;
  }
  .suc-next-info { flex: 1; min-width: 0; }
  .suc-next-name {
    font-size: .9rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .suc-next-desc {
    font-size: .8rem;
    color: var(--dim);
    line-height: 1.4;
  }
  .suc-next-progress {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,.06);
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }
  .suc-next-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #f59e0b, #f97316);
  }
  .suc-next-meta {
    font-size: .75rem;
    color: var(--dim);
    text-align: right;
    flex-shrink: 0;
    min-width: 50px;
  }

  /* ── Grille catégories ── */
  .suc-cats-title {
    font-size: .85rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--dim);
    font-weight: 700;
    margin: 24px 0 12px;
  }
  .suc-cats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .suc-cat-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 14px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    color: inherit;
    display: flex; flex-direction: column; gap: 10px;
    --cat-color: #7ec0ff;
  }
  .suc-cat-card:hover {
    background: rgba(255,255,255,.07);
    transform: translateY(-2px);
    border-color: var(--cat-color);
  }
  .suc-cat-head {
    display: flex; align-items: center; gap: 12px;
  }
  .suc-cat-icon { font-size: 28px; flex-shrink: 0; }
  .suc-cat-name {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    flex: 1;
  }
  .suc-cat-count {
    font-size: .75rem;
    background: rgba(255,255,255,.06);
    padding: 3px 8px;
    border-radius: 8px;
    font-weight: 600;
    color: var(--text);
    flex-shrink: 0;
  }
  .suc-cat-desc {
    font-size: .8rem;
    color: var(--dim);
    line-height: 1.45;
    margin: 0;
  }
  .suc-cat-bar {
    height: 4px;
    background: rgba(255,255,255,.06);
    border-radius: 2px;
    overflow: hidden;
  }
  .suc-cat-bar-fill {
    height: 100%;
    background: var(--cat-color);
    transition: width .4s ease;
  }

  /* ── Vue catégorie (détail) ── */
  .suc-cat-detail { display: none; }
  .suc-cat-detail.active { display: block; }
  .suc-section-title {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--dim);
    font-weight: 700;
    margin: 18px 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .suc-section-title .num {
    background: rgba(255,255,255,.06);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: .7rem;
    color: var(--text);
    font-weight: 700;
  }

  .suc-trophy {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 8px;
  }
  .suc-trophy.unlocked {
    background: linear-gradient(135deg, rgba(16,185,129,.10), rgba(255,255,255,.04));
    border-color: rgba(16,185,129,.30);
  }
  .suc-trophy.locked { opacity: .60; }
  .suc-trophy.hidden-secret {
    opacity: .50;
    background: rgba(167,139,250,.06);
    border-color: rgba(167,139,250,.20);
  }
  .suc-trophy-icon {
    font-size: 28px;
    width: 36px; text-align: center;
    flex-shrink: 0;
  }
  .suc-trophy.hidden-secret .suc-trophy-icon { filter: grayscale(1); }
  .suc-trophy-info { flex: 1; min-width: 0; }
  .suc-trophy-name {
    font-size: .9rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .suc-trophy.hidden-secret .suc-trophy-name {
    font-style: italic;
    color: var(--dim);
  }
  .suc-trophy-desc {
    font-size: .75rem;
    color: var(--dim);
    line-height: 1.4;
  }
  .suc-trophy-bar {
    height: 3px;
    background: rgba(255,255,255,.06);
    border-radius: 2px;
    margin-top: 5px;
    overflow: hidden;
  }
  .suc-trophy-bar-fill {
    height: 100%;
    background: #f59e0b;
  }
  .suc-trophy-meta {
    flex-shrink: 0;
    text-align: right;
    font-size: .7rem;
  }
  .suc-trophy-xp {
    color: #fbbf24;
    font-weight: 700;
  }
  .suc-trophy-tier {
    color: var(--dim);
    margin-top: 2px;
  }

  .suc-empty {
    text-align: center;
    color: var(--dim);
    padding: 30px;
    font-size: .85rem;
    font-style: italic;
  }
</style>

<body>

<div class="suc-page">
  <a href="../index.html" class="suc-back">← Retour à l'accueil</a>

  <!-- Vue principale -->
  <div id="suc-home">
    <div class="suc-summary">
      <div class="suc-summary-count">
        <span id="suc-unlocked">—</span><span class="total"> / <span id="suc-total">148</span></span>
      </div>
      <div class="suc-summary-percent"><span id="suc-percent">—</span>&nbsp;% débloqués</div>
      <div class="suc-summary-xp">
        <span id="suc-xp-earned">—</span> XP sur <span id="suc-xp-max">—</span> max
      </div>
      <div class="suc-summary-tier-row" id="suc-tiers">
        <!-- Rempli par JS -->
      </div>
    </div>

    <div class="suc-next" id="suc-next-block">
      <div class="suc-next-label">⚡ Prochains déblocages</div>
      <div id="suc-next-list">
        <div class="suc-empty">Joue une scène ou un quiz pour voir tes objectifs proches.</div>
      </div>
    </div>

    <h2 class="suc-cats-title">📂 Catégories</h2>
    <div class="suc-cats-grid" id="suc-cats-grid">
      <div class="suc-empty">Chargement…</div>
    </div>
  </div>

  <!-- Vue détail catégorie -->
  <div id="suc-detail" class="suc-cat-detail">
    <button class="suc-back" id="suc-detail-back" type="button" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);cursor:pointer">← Toutes les catégories</button>
    <div id="suc-detail-content"></div>
  </div>
</div>

<script src="../js/core/cas-in-profile.js" defer></script>
<script src="../js/core/cas-in-achievements.js" defer></script>

</body>
