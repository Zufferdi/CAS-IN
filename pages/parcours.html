<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<script>
(function(){try{var p=localStorage.getItem('cas_theme_pref');
document.documentElement.setAttribute('data-theme',p==='light'?'light':'dark');}catch(e){
document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Parcours · CAS-IN</title>
<meta name="description" content="Parcours pédagogiques structurés · CAS-IN">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="../pwa.manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@700;800&display=swap">
<link rel="stylesheet" href="../style/landing.css">
<link rel="stylesheet" href="../style/profile.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛤️</text></svg>">
<style>
  .parcours-page { max-width: 1100px; margin: 0 auto; padding: 18px 16px 80px; }
  .parcours-hero {
    text-align: center;
    margin-bottom: 28px;
  }
  .parcours-hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    margin: 0 0 8px;
  }
  .parcours-hero p {
    color: var(--dim);
    font-size: 14px;
    max-width: 600px;
    margin: 0 auto;
  }
  .parcours-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .parcours-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;
    padding: 18px 18px 16px;
    cursor: pointer;
    transition: all 0.18s;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .parcours-card:hover {
    border-color: rgba(255,255,255,.25);
    background: rgba(255,255,255,.07);
    transform: translateY(-2px);
  }
  .parcours-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--card-color, #7ec0ff);
  }
  .parcours-card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .parcours-card-icon { font-size: 32px; line-height: 1; }
  .parcours-card-title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
  }
  .parcours-card-desc {
    font-size: 12px;
    color: var(--dim);
    line-height: 1.55;
    margin-bottom: 12px;
    min-height: 50px;
  }
  .parcours-card-meta {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--dim);
    margin-bottom: 12px;
  }
  .parcours-card-meta span {
    background: rgba(255,255,255,.05);
    padding: 3px 8px;
    border-radius: 5px;
  }
  .parcours-card-progress {
    margin-top: 10px;
  }
  .parcours-progress-bar {
    height: 6px;
    background: rgba(255,255,255,.08);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .parcours-progress-bar-fill {
    height: 100%;
    background: var(--card-color, #7ec0ff);
    transition: width 0.4s;
    border-radius: 4px;
  }
  .parcours-progress-label {
    font-size: 10px;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--dim);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 16px;
    padding: 6px 0;
  }
  .back-link:hover { color: var(--text); }
  .difficulty-badge {
    display: inline-block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: 8px;
    background: rgba(255,255,255,.08);
    color: var(--dim);
  }
</style>
</head>
<body>
<div class="parcours-page">
  <a href="profile.html" class="back-link">← Retour au profil</a>

  <div class="parcours-hero">
    <h1>🛤️ Parcours pédagogiques</h1>
    <p>6 parcours thématiques structurés pour préparer le CAS-IN. Chaque parcours combine fiches, quiz ciblés et études de cas immersives.</p>
  </div>

  <div class="parcours-grid" id="parcours-grid">
    <!-- généré par JS -->
  </div>
</div>

<script src="../js/core/cas-in-mastery-quiz.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  function escapeHtml(s) {
    return String(s||'').replace(/[&<>"']/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});
  }

  function lsGet(k, fb) {
    try { var r = localStorage.getItem(k); return r === null ? fb : JSON.parse(r); }
    catch (e) { return fb; }
  }

  fetch('data/parcours.json').then(function(r){return r.json();}).then(function(parcours){
    var byChapter = lsGet('byChapter', {}) || {};
    var parcoursProgress = lsGet('parcoursProgress', {}) || {};
    var grid = document.getElementById('parcours-grid');

    grid.innerHTML = parcours.map(function(p){
      // Progression : nombre d'étapes complétées / total
      var prog = parcoursProgress[p.id] || { stepsCompleted: [] };
      var stepsDone = (prog.stepsCompleted || []).length;
      var totalSteps = p.steps.length;
      var pct = totalSteps > 0 ? Math.round(stepsDone / totalSteps * 100) : 0;

      // Compter ressources
      var nFiches = 0, nScenes = 0, nChapters = 0;
      p.steps.forEach(function(s){
        nFiches += (s.fiches || []).length;
        nScenes += (s.scenes || []).length;
        nChapters += (s.chapters_quiz || []).length;
      });

      return '<a href="parcours-detail.html?id=' + encodeURIComponent(p.id) + '" class="parcours-card" style="--card-color:' + p.color + '">'
        + '<div class="parcours-card-header">'
        +   '<div class="parcours-card-icon">' + (p.icon || '📖') + '</div>'
        +   '<div class="parcours-card-title">' + escapeHtml(p.title)
        +     '<span class="difficulty-badge">' + escapeHtml(p.difficulty || '') + '</span>'
        +   '</div>'
        + '</div>'
        + '<div class="parcours-card-desc">' + escapeHtml(p.description) + '</div>'
        + '<div class="parcours-card-meta">'
        +   '<span>📚 ' + totalSteps + ' étapes</span>'
        +   '<span>📖 ' + nFiches + ' fiches</span>'
        +   '<span>🎯 ' + nChapters + ' quiz</span>'
        +   '<span>🎬 ' + nScenes + ' scènes</span>'
        +   '<span>⏱ ' + escapeHtml(p.duration_estimate || '?') + '</span>'
        + '</div>'
        + '<div class="parcours-card-progress">'
        +   '<div class="parcours-progress-bar">'
        +     '<div class="parcours-progress-bar-fill" style="width:' + pct + '%"></div>'
        +   '</div>'
        +   '<div class="parcours-progress-label">'
        +     '<span>' + stepsDone + ' / ' + totalSteps + ' étapes</span>'
        +     '<span>' + pct + '%</span>'
        +   '</div>'
        + '</div>'
        + '</a>';
    }).join('');
  }).catch(function(err){
    document.getElementById('parcours-grid').innerHTML = '<div style="padding:30px;text-align:center;color:var(--dim)">Erreur de chargement des parcours.</div>';
    console.error(err);
  });
});
</script>
</body>
</html>
