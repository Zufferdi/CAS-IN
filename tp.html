<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<script>
/* v2.92 — Applique la préférence manuelle clair/sombre AVANT le rendu CSS
   pour éviter le flash de thème inverse. Défaut = sombre (data-theme="dark"). */
(function(){try{var p=localStorage.getItem('cas_theme_pref');
document.documentElement.setAttribute('data-theme',p==='light'?'light':'dark');}catch(e){
document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TP Forensique — CAS-IN</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<meta name="description" content="25 exercices de TP forensique interactifs — endianness, FAT16, NTFS, exFAT, EXT3, HFS+, MFT, RunList, parsing hex. Chaque exercice avec correction commentée.">
<link rel="canonical" href="https://zufferdi.github.io/CAS-IN/tp.html">
<meta property="og:title" content="TP Forensique · CAS-IN">
<meta property="og:description" content="Travaux pratiques interactifs de forensique numérique — parsing hex, MFT, RunList, systèmes de fichiers, avec correction commentée">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zufferdi.github.io/CAS-IN/tp.html">
<meta property="og:image" content="https://zufferdi.github.io/CAS-IN/og-image.svg">
<meta property="og:site_name" content="CAS-IN · Investigation Numérique">
<meta property="og:locale" content="fr_CH">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="TP Forensique · CAS-IN">
<meta name="twitter:description" content="Travaux pratiques interactifs de forensique numérique — parsing hex, MFT, RunList, systèmes de fichiers">
<meta name="twitter:image" content="https://zufferdi.github.io/CAS-IN/og-image.svg">
<link rel="stylesheet" href="style/cas-in-navbar.css">
<link rel="stylesheet" href="style/tp.css">
<script src="js/core/cas-in-counts.js" defer></script>
<script src="js/core/cas-in-pwa.js" defer></script>
<script src="js/core/cas-in-search.js" defer></script>
<link rel="stylesheet" href="style/tp-page.css">
<!-- ⚠ ORDRE CRITIQUE — ne pas réordonner :
     1. cas-in-profile.js définit window.Profile (source de vérité)
     2. profile-track-v5.js / tp-profile-bridge.js dépendent de Profile
     Voir docs/ARCHITECTURE.md § « Couches & ordre de chargement ». -->
<script src="js/core/cas-in-profile.js" defer></script>
<script src="js/profile/profile-track-v5.js" defer></script>
<script src="js/core/cas-in-achievements.js" defer></script>
<script src="js/profile/profile-titles.js" defer></script>
<script src="js/bridges/tp-profile-bridge.js" defer></script>
<link rel="stylesheet" href="style/gamification-toasts.css">
</head>
<body>
<div id="cas-navbar" data-page="tp"></div>

<!-- Mobile pills -->
<div class="mob-pills" id="mob-pills"></div>

<div class="tp-shell">

  <!-- ══ SIDEBAR ══════════════════════════════════════════════ -->
  <aside class="sidebar">
    <div class="sb-search">
      <div class="sb-search-field">
        <span class="sb-search-icon">🔍</span>
        <input class="sb-search-input" id="sb-search" type="search"
          placeholder="Chercher une catégorie…" autocomplete="off"
          oninput="sbSearch(this.value)">
      </div>
    </div>

    <div class="sb-scroll">

      <!-- Groupe 1 — Systèmes de fichiers -->
      <div class="sb-group group-fs" id="grp-fs">
        <div class="sb-group-header" onclick="toggleGrp('grp-fs')">
          <span class="sb-group-icon">💾</span>
          <span class="sb-group-name">Systèmes de fichiers</span>
          <span class="sb-group-count" id="gc-fs">15</span>
          <div class="sb-grp-prog"><div class="sb-grp-track"><div class="sb-grp-fill" id="gp-fs" style="width:0%;background:var(--gold)"></div></div><span class="sb-grp-label" id="gl-fs">0%</span></div>
          <span class="sb-arrow">›</span>
        </div>
        <div class="sb-group-body">
          <button type="button" class="sb-cat active" data-cat="endian"      onclick="go('endian',this)">      <span class="sb-cat-icon">🔄</span><span class="sb-cat-name">Endianness</span>          <span class="sb-badge sb-badge-none" id="bd-endian">—</span></button>
          <button type="button" class="sb-cat"        data-cat="timestamp"   onclick="go('timestamp',this)">   <span class="sb-cat-icon">⏱</span><span class="sb-cat-name">Timestamps FAT</span>        <span class="sb-badge sb-badge-none" id="bd-timestamp">—</span></button>
          <button type="button" class="sb-cat"        data-cat="bitmap"      onclick="go('bitmap',this)">      <span class="sb-cat-icon">🗺</span><span class="sb-cat-name">Bitmap exFAT</span>          <span class="sb-badge sb-badge-none" id="bd-bitmap">—</span></button>
          <button type="button" class="sb-cat"        data-cat="fat"         onclick="go('fat',this)">         <span class="sb-cat-icon">⛓</span><span class="sb-cat-name">Chaîne FAT</span>            <span class="sb-badge sb-badge-none" id="bd-fat">—</span></button>
          <button type="button" class="sb-cat"        data-cat="magic"       onclick="go('magic',this)">       <span class="sb-cat-icon">✨</span><span class="sb-cat-name">Magic Bytes</span>           <span class="sb-badge sb-badge-none" id="bd-magic">—</span></button>
          <button type="button" class="sb-cat"        data-cat="mismatch"    onclick="go('mismatch',this)">    <span class="sb-cat-icon">🎭</span><span class="sb-cat-name">Mismatch</span>              <span class="sb-badge sb-badge-none" id="bd-mismatch">—</span></button>
          <button type="button" class="sb-cat"        data-cat="runlist"     onclick="go('runlist',this)">     <span class="sb-cat-icon">🧩</span><span class="sb-cat-name">Run List NTFS</span>         <span class="sb-badge sb-badge-none" id="bd-runlist">—</span></button>
          <button type="button" class="sb-cat"        data-cat="effacement"  onclick="go('effacement',this)">  <span class="sb-cat-icon">🗑</span><span class="sb-cat-name">Effacement FAT</span>        <span class="sb-badge sb-badge-none" id="bd-effacement">—</span></button>
          <button type="button" class="sb-cat"        data-cat="timestomping" onclick="go('timestomping',this)"><span class="sb-cat-icon">🕰</span><span class="sb-cat-name">Timestomping</span>          <span class="sb-badge sb-badge-none" id="bd-timestomping">—</span></button>
          <button type="button" class="sb-cat"        data-cat="mbr"         onclick="go('mbr',this)">         <span class="sb-cat-icon">💽</span><span class="sb-cat-name">MBR / GPT</span>             <span class="sb-badge sb-badge-none" id="bd-mbr">—</span></button>
          <button type="button" class="sb-cat"        data-cat="direntry"    onclick="go('direntry',this)">    <span class="sb-cat-icon">📁</span><span class="sb-cat-name">Directory Entry FAT</span>   <span class="sb-badge sb-badge-none" id="bd-direntry">—</span></button>
          <button type="button" class="sb-cat"        data-cat="hexdump"     onclick="go('hexdump',this)">     <span class="sb-cat-icon">🔬</span><span class="sb-cat-name">Dump Hex en contexte</span>  <span class="sb-badge sb-badge-none" id="bd-hexdump">—</span></button>
          <button type="button" class="sb-cat"        data-cat="slackspace"  onclick="go('slackspace',this)">  <span class="sb-cat-icon">🪣</span><span class="sb-cat-name">Slack Space</span>           <span class="sb-badge sb-badge-none" id="bd-slackspace">—</span></button>
          <button type="button" class="sb-cat"        data-cat="hfsbtree"    onclick="go('hfsbtree',this)">    <span class="sb-cat-icon">🌳</span><span class="sb-cat-name">B-Tree HFS+</span>           <span class="sb-badge sb-badge-none" id="bd-hfsbtree">—</span><span class="sb-new">NEW</span></button>
          <button type="button" class="sb-cat"        data-cat="ntfsindex"   onclick="go('ntfsindex',this)">   <span class="sb-cat-icon">📇</span><span class="sb-cat-name">$INDEX NTFS</span>           <span class="sb-badge sb-badge-none" id="bd-ntfsindex">—</span><span class="sb-new">NEW</span></button>
        </div>
      </div>

      <!-- Groupe 1bis — Artefacts Windows -->
      <div class="sb-group group-win collapsed" id="grp-win">
        <div class="sb-group-header" onclick="toggleGrp('grp-win')">
          <span class="sb-group-icon">🪟</span>
          <span class="sb-group-name">Artefacts Windows</span>
          <span class="sb-group-count" id="gc-win">3</span>
          <div class="sb-grp-prog"><div class="sb-grp-track"><div class="sb-grp-fill" id="gp-win" style="width:0%;background:var(--cyan)"></div></div><span class="sb-grp-label" id="gl-win">0%</span></div>
          <span class="sb-arrow">›</span>
        </div>
        <div class="sb-group-body">
          <button type="button" class="sb-cat" data-cat="registry" onclick="go('registry',this)"><span class="sb-cat-icon">📂</span><span class="sb-cat-name">Registry NK/VK</span>        <span class="sb-badge sb-badge-none" id="bd-registry">—</span><span class="sb-new">NEW</span></button>
          <button type="button" class="sb-cat" data-cat="prefetch" onclick="go('prefetch',this)"><span class="sb-cat-icon">⏱️</span><span class="sb-cat-name">Prefetch (.pf)</span>        <span class="sb-badge sb-badge-none" id="bd-prefetch">—</span><span class="sb-new">NEW</span></button>
          <button type="button" class="sb-cat" data-cat="lnk"      onclick="go('lnk',this)">     <span class="sb-cat-icon">🔗</span><span class="sb-cat-name">LNK (raccourcis)</span>     <span class="sb-badge sb-badge-none" id="bd-lnk">—</span><span class="sb-new">NEW</span></button>
        </div>
      </div>

      <!-- Groupe 2 — Calculs & Identification -->
      <div class="sb-group group-calc collapsed" id="grp-calc">
        <div class="sb-group-header" onclick="toggleGrp('grp-calc')">
          <span class="sb-group-icon">📐</span>
          <span class="sb-group-name">Calculs &amp; Identification</span>
          <span class="sb-group-count" id="gc-calc">5</span>
          <div class="sb-grp-prog"><div class="sb-grp-track"><div class="sb-grp-fill" id="gp-calc" style="width:0%;background:var(--blue)"></div></div><span class="sb-grp-label" id="gl-calc">0%</span></div>
          <span class="sb-arrow">›</span>
        </div>
        <div class="sb-group-body">
          <button type="button" class="sb-cat" data-cat="hextable"   onclick="go('hextable',this)">  <span class="sb-cat-icon">🗺</span><span class="sb-cat-name">Table Hex</span>             <span class="sb-badge sb-badge-none" id="bd-hextable">—</span></button>
          <button type="button" class="sb-cat" data-cat="fsidentify" onclick="go('fsidentify',this)"><span class="sb-cat-icon">🔍</span><span class="sb-cat-name">Identifier le FS</span>      <span class="sb-badge sb-badge-none" id="bd-fsidentify">—</span></button>
          <button type="button" class="sb-cat" data-cat="offset"     onclick="go('offset',this)">    <span class="sb-cat-icon">📐</span><span class="sb-cat-name">Calcul d'offset</span>       <span class="sb-badge sb-badge-none" id="bd-offset">—</span></button>
          <button type="button" class="sb-cat" data-cat="bases"      onclick="go('bases',this)">     <span class="sb-cat-icon">🔢</span><span class="sb-cat-name">Bases &amp; Encodages</span> <span class="sb-badge sb-badge-none" id="bd-bases">—</span></button>
          <button type="button" class="sb-cat" data-cat="hash"       onclick="go('hash',this)">      <span class="sb-cat-icon">🔑</span><span class="sb-cat-name">Hash &amp; Intégrité</span>  <span class="sb-badge sb-badge-none" id="bd-hash">—</span></button>
        </div>
      </div>

      <!-- Groupe 3 — Investigation -->
      <div class="sb-group group-inv collapsed" id="grp-inv">
        <div class="sb-group-header" onclick="toggleGrp('grp-inv')">
          <span class="sb-group-icon">🔍</span>
          <span class="sb-group-name">Investigation</span>
          <span class="sb-group-count" id="gc-inv">6</span>
          <div class="sb-grp-prog"><div class="sb-grp-track"><div class="sb-grp-fill" id="gp-inv" style="width:0%;background:var(--purple)"></div></div><span class="sb-grp-label" id="gl-inv">0%</span></div>
          <span class="sb-arrow">›</span>
        </div>
        <div class="sb-group-body">
          <button type="button" class="sb-cat" data-cat="email"      onclick="go('email',this)">     <span class="sb-cat-icon">✉️</span><span class="sb-cat-name">Email Forensics</span>       <span class="sb-badge sb-badge-none" id="bd-email">—</span></button>
          <button type="button" class="sb-cat" data-cat="network"    onclick="go('network',this)">   <span class="sb-cat-icon">📡</span><span class="sb-cat-name">Réseau &amp; PCAP</span>     <span class="sb-badge sb-badge-none" id="bd-network">—</span></button>
          <button type="button" class="sb-cat" data-cat="ir"         onclick="go('ir',this)">        <span class="sb-cat-icon">🚨</span><span class="sb-cat-name">Incident Response</span>     <span class="sb-badge sb-badge-none" id="bd-ir">—</span></button>
          <button type="button" class="sb-cat" data-cat="droitpenal" onclick="go('droitpenal',this)"><span class="sb-cat-icon">⚖️</span><span class="sb-cat-name">Droit pénal</span>           <span class="sb-badge sb-badge-none" id="bd-droitpenal">—</span></button>
          <button type="button" class="sb-cat" data-cat="glossaire"  onclick="go('glossaire',this)"> <span class="sb-cat-icon">🗂</span><span class="sb-cat-name">Glossaire</span>             <span class="sb-badge sb-badge-none" id="bd-glossaire">—</span></button>
          <button type="button" class="sb-cat" data-cat="examen"     onclick="go('examen',this)">    <span class="sb-cat-icon">📋</span><span class="sb-cat-name">Série Examen</span>          <span class="sb-badge sb-badge-star" id="bd-examen">★</span></button>
        </div>
      </div>

      <!-- Groupe 4 — Outils & Examen -->
      <div class="sb-group collapsed" id="grp-tools">
        <div class="sb-group-header" onclick="toggleGrp('grp-tools')">
          <span class="sb-group-icon">🔧</span>
          <span class="sb-group-name">Outils &amp; Examen</span>
          <span class="sb-group-count">2</span>
          <span class="sb-arrow">›</span>
        </div>
        <div class="sb-group-body">
          <button type="button" class="sb-cat" data-cat="_exam"  onclick="showTool('exam',this)"> <span class="sb-cat-icon">⏱</span><span class="sb-cat-name">Examen Blanc</span>          <span class="sb-new">NEW</span></button>
          <button type="button" class="sb-cat" data-cat="_tools" onclick="showTool('tools',this)"><span class="sb-cat-icon">🔧</span><span class="sb-cat-name">Calculateurs forensiques</span><span class="sb-new">NEW</span></button>
        </div>
      </div>

    </div><!-- /.sb-scroll -->

    <!-- Footer -->
    <div class="sb-footer">
      <div class="sbf-score">
        <span class="sbf-score-n" id="sbf-label">0 résolus</span>
        <span class="sbf-streak" id="sbf-streak"></span>
      </div>
      <div class="sbf-track"><div class="sbf-fill" id="sbf-fill" style="width:0%"></div></div>
      <div class="sbf-actions">
        <button type="button" class="sbf-btn sbf-btn-primary" onclick="newExercise()" aria-label="Nouvel exercice">↻ Nouvel</button>
        <button type="button" class="sbf-btn" onclick="doReset()" aria-label="Réinitialiser les scores">⟳ Reset</button>
      </div>
    </div>
  </aside>

  <!-- ══ MAIN ══════════════════════════════════════════════════ -->
  <main class="tp-main">

    <!-- Context header -->
    <div class="tp-ctx" id="tp-ctx">
      <div class="tp-ctx-icon" id="ctx-icon">🔄</div>
      <div class="tp-ctx-info">
        <div class="tp-ctx-name" id="ctx-name">Endianness</div>
        <div class="tp-ctx-sub"  id="ctx-sub">Maîtrisez la lecture Little Endian / Big Endian</div>
      </div>
      <div class="tp-ctx-actions">
        <span class="tp-ctx-badge" id="ctx-badge">0 résolus</span>
        <button type="button" class="tp-ctx-btn" onclick="newExercise()" aria-label="Nouvel exercice">↻ Nouveau</button>
      </div>
    </div>

    <!-- Exercise -->
    <div class="tp-exercise-area" id="tp-content">
      <div id="ex-container"></div>
    </div>

    <!-- Iframe (outils/examen) -->
    <div class="tp-iframe-wrap" id="tool-frame">
      <div class="tp-iframe-bar">
        <div class="tp-iframe-title" id="frame-title">⏱ Examen Blanc</div>
        <a class="tp-iframe-link" id="frame-link" href="exam.html" target="_blank">↗ Ouvrir dans un onglet</a>
      </div>
      <iframe class="tp-iframe" id="tool-iframe" src="" style="height:calc(100vh - 120px)"></iframe>
    </div>

  </main>
</div><!-- /.tp-shell -->

<!-- Toast -->
<div class="tp-toast" id="tp-toast">
  <div class="tp-toast-icon" id="toast-icon">🎉</div>
  <div class="tp-toast-msg">
    <strong id="toast-title">Bravo !</strong>
    <span id="toast-sub">Exercice résolu</span>
  </div>
</div>

<script src="tp/tp-data.js" defer></script>
<script src="tp/tp-engine.js" defer></script>
<script src="tp/tp-engine-fat.js" defer></script>
<script src="tp/tp-engine-ntfs.js" defer></script>
<script src="tp/tp-engine-disk.js" defer></script>
<script src="tp/tp-engine-carving.js" defer></script>
<script src="tp/tp-engine-windows.js" defer></script>
<script src="tp/tp-engine-meta.js" defer></script>
<script src="tp/tp-engine-btree.js" defer></script>
<script src="js/pages/tp-page.js" defer></script>
<script src="js/components/fiche-search.js" defer></script>
<script src="js/components/search-modal.js" defer></script>
<script src="js/core/cas-in-theme-toggle.js" defer></script>
<script src="js/core/cas-in-navbar.js" defer></script>
<script src="js/profile/celebration-ui.js" defer></script>
<script src="js/components/gamification-toasts.js" defer></script>
</body>
</html>
