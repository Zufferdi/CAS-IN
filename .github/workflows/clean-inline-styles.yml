name: Supprimer styles inline des fiches

on:
  push:
    branches:
      - refactor-v2.3-from-main
    paths:
      - 'fiches/**'

jobs:
  clean-styles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branche refactor
        uses: actions/checkout@v4
        with:
          ref: refactor-v2.3-from-main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Appliquer le nettoyage
        run: |
          python3 - << 'PYEOF'
          import re, os, glob

          STYLE_RE = re.compile(r'\n?\s*<style[^>]*>.*?</style>', re.DOTALL | re.IGNORECASE)
          files = sorted(glob.glob('fiches/*.html'))
          changed, unchanged = 0, 0

          for path in files:
              with open(path, 'r', encoding='utf-8') as f:
                  original = f.read()
              cleaned = STYLE_RE.sub('', original)
              if cleaned == original:
                  unchanged += 1
                  print(f"  —  {os.path.basename(path)}")
              else:
                  blocks = len(STYLE_RE.findall(original))
                  diff = len(original) - len(cleaned)
                  changed += 1
                  print(f"  ✓  {os.path.basename(path)}  ({blocks} bloc(s), -{diff} octets)")
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(cleaned)

          print(f"\nModifiés: {changed}  |  Inchangés: {unchanged}")
          PYEOF

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fiches/
          git diff --cached --quiet && echo "Rien à committer" && exit 0
          git commit -m "chore: suppression styles inline — CSS unifié dans ../style/fiche_style.css"
          git push
