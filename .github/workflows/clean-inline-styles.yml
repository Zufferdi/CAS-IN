name: Supprimer styles inline des fiches

on:
  push:
    branches:
      - refactor-v2.3-from-main

jobs:
  clean-styles:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor-v2.3-from-main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Nettoyage (hors index.html)
        run: |
          python3 - << 'PYEOF'
          import re, os, glob
          STYLE_RE = re.compile(r'\n?\s*<style[^>]*>.*?</style>', re.DOTALL | re.IGNORECASE)
          files = [f for f in sorted(glob.glob('fiches/*.html')) if not f.endswith('index.html')]
          changed = 0
          for path in files:
              with open(path,'r',encoding='utf-8') as f: orig=f.read()
              cleaned=STYLE_RE.sub('',orig)
              if cleaned!=orig:
                  changed+=1
                  print(f"  ✓ {os.path.basename(path)}")
                  with open(path,'w',encoding='utf-8') as f: f.write(cleaned)
              else:
                  print(f"  — {os.path.basename(path)}")
          print(f"\nModifiés: {changed}")
          PYEOF

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fiches/
          git diff --cached --quiet && echo "Rien a committer" && exit 0
          git commit -m "chore: suppression styles inline (hors index.html)"
          git push
