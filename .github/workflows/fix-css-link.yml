name: Vérifier et corriger lien CSS dans toutes les fiches

on:
  push:
    branches:
      - refactor-v2.3-from-main

jobs:
  fix-css:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor-v2.3-from-main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifier et corriger le lien CSS
        run: |
          python3 - << 'PYEOF'
          import re, os, glob

          CORRECT = '<link rel="stylesheet" href="../style/fiche_style.css">'

          WRONG = re.compile(
            r'<link[^>]+href="(?!\.\.\/style\/fiche_style\.css)[^"]*(?:fiche_style|fiche-hub|fiche)\.css"[^>]*>',
            re.IGNORECASE
          )

          files = sorted(glob.glob('fiches/*.html'))
          ok, fixed, added = 0, 0, 0

          for path in files:
              name = os.path.basename(path)
              with open(path, 'r', encoding='utf-8') as f:
                  html = f.read()

              has_correct = CORRECT in html
              has_wrong   = bool(WRONG.search(html))

              if has_correct and not has_wrong:
                  print(f"  OK  {name}")
                  ok += 1
                  continue

              if has_wrong:
                  html = WRONG.sub(CORRECT, html, count=1)
                  fixed += 1
                  print(f"  FIX {name}")
              elif not has_correct:
                  html = html.replace('<head>', '<head>\n' + CORRECT, 1)
                  added += 1
                  print(f"  ADD {name}")

              with open(path, 'w', encoding='utf-8') as f:
                  f.write(html)

          print(f"\nOK:{ok}  Fixes:{fixed}  Ajouts:{added}")
          PYEOF

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fiches/
          git diff --cached --quiet && echo "Rien a committer" && exit 0
          git commit -m "fix: lien CSS unifie dans toutes les fiches"
          git push
