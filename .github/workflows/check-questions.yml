name: Check questions.json

on:
  push:
    paths:
      - 'questions.json'
      - 'questions.js'
      - 'scripts/check_questions.py'
      - '.github/workflows/check-questions.yml'
  pull_request:
    paths:
      - 'questions.json'
      - 'questions.js'
      - 'scripts/check_questions.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run quality checks
        run: |
          if [ -f questions.json ]; then
            python3 scripts/check_questions.py questions.json
          else
            python3 scripts/check_questions.py questions.js
          fi

      - name: Generate cleaned version
        if: success()
        run: |
          if [ -f questions.json ]; then
            python3 scripts/check_questions.py questions.json --fix --out questions.cleaned.json
          fi
        continue-on-error: true

      - name: Upload cleaned artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: questions-cleaned
          path: questions.cleaned.json
          if-no-files-found: ignore
          retention-days: 30
