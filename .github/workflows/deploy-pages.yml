name: Deploy to GitHub Pages

# Workflow custom de déploiement GitHub Pages.
# Remplace le mécanisme automatique "Deploy from a branch" qui souffre
# d'erreurs intermittentes "Internal server error" côté GitHub.
#
# Pré-requis : Settings → Pages → Source = "GitHub Actions"
# (et non plus "Deploy from a branch").
#
# Déclencheurs :
#   - push sur la branche 3.0 (auto)
#   - manuel via Actions → "Deploy to GitHub Pages" → "Run workflow"

on:
  push:
    branches:
      - "3.0"
  workflow_dispatch:

# Permissions requises pour déployer sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Empêche deux déploiements concurrents — annule l'ancien si un nouveau push arrive
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Le repo entier est uploadé tel quel — c'est un site statique
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
