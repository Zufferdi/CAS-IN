name: Regenerate counts.json

on:
  push:
    paths:
      - 'questions.json'
      - 'questions.js'
      - 'manifest.json'
      - 'scenes.js'
      - 'tp.html'
      - 'scripts/generate_counts.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate counts.json
        run: python3 scripts/generate_counts.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet counts.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add counts.json
          git commit -m "chore(counts): auto-regenerate counts.json [skip ci]"
          git push
