name: Sync fiches index, search-index, cross-links, scenes-index & inject components

# Régénère TOUTES les données dérivées à chaque ajout/modification de fiche ou scène :
#   1. Injecte fiche-related.js dans les fiches qui ne l'ont pas
#   2. Injecte fiche-common.js dans les fiches qui ne l'ont pas
#   3. Injecte fiche-reader.js dans les fiches qui ne l'ont pas (mode lecture continue)
#   4. Régénère scenes/index.json depuis les scènes individuelles
#   5. Régénère fiches/index.html (cards d'accès)
#   6. Régénère data/search-index.json (moteur de recherche full-text)
#   7. Régénère data/cross-links.json (liens Q ↔ Fiche ↔ TP ↔ Scènes)
#   8. Régénère data/fiche-graph.json (voisinages pour mode lecture continue)
#
# Fait tout en un seul job pour éviter les race conditions entre workflows
# parallèles qui voudraient committer les mêmes fichiers.

on:
  push:
    paths:
      - 'fiches/**.html'
      - 'data/manifest.json'
      - 'scenes/**.json'
      - 'tp.html'
      - 'scripts/build_index.py'
      - 'scripts/build_search_index.py'
      - 'scripts/build_cross_links.py'
      - 'scripts/build_scenes_index.py'
      - 'scripts/build_fiche_graph.py'
      - 'scripts/inject_fiche_related.py'
      - 'scripts/inject_fiche_reader.py'
      - 'scripts/migrate_fiche_common.py'
      - '.github/workflows/sync-fiches-index.yml'
  workflow_dispatch:  # exécution manuelle depuis l'onglet Actions

permissions:
  contents: write  # nécessaire pour commit les fichiers régénérés

# Empêche deux runs sur la même branche en parallèle (les anciens sont annulés)
concurrency:
  group: sync-fiches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # Évite la boucle infinie : ne tourne pas si le commit vient déjà du bot
    if: ${{ !contains(github.event.head_commit.message, 'auto-rebuild') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml

      # ─── 1) Inject fiche-related.js dans les fiches qui ne l'ont pas ───
      - name: Inject fiche-related.js into new fiches
        run: |
          if [ -f scripts/inject_fiche_related.py ]; then
            python3 scripts/inject_fiche_related.py
          else
            echo "⚠ scripts/inject_fiche_related.py introuvable, skip"
          fi

      # ─── 2) Inject fiche-common.js + nettoyer patterns inline répétés ───
      - name: Migrate fiches to fiche-common.js
        run: |
          if [ -f scripts/migrate_fiche_common.py ]; then
            python3 scripts/migrate_fiche_common.py
          else
            echo "⚠ scripts/migrate_fiche_common.py introuvable, skip"
          fi

      # ─── 3) Inject fiche-reader.js (mode lecture continue) ───
      - name: Inject fiche-reader.js into fiches
        run: |
          if [ -f scripts/inject_fiche_reader.py ]; then
            python3 scripts/inject_fiche_reader.py
          else
            echo "⚠ scripts/inject_fiche_reader.py introuvable, skip"
          fi

      # ─── 4) Régénérer scenes/index.json depuis les scènes individuelles ───
      - name: Rebuild scenes/index.json
        run: |
          if [ -f scripts/build_scenes_index.py ]; then
            python3 scripts/build_scenes_index.py
          else
            echo "⚠ scripts/build_scenes_index.py introuvable, skip"
          fi

      # ─── 5) Régénérer fiches/index.html (cards d'accès) ───
      - name: Rebuild fiches/index.html
        run: |
          python3 scripts/build_index.py

      # ─── 6) Régénérer data/search-index.json (moteur de recherche) ───
      - name: Rebuild data/search-index.json
        run: |
          if [ -f scripts/build_search_index.py ]; then
            python3 scripts/build_search_index.py
          else
            echo "⚠ scripts/build_search_index.py introuvable, skip"
          fi

      # ─── 7) Régénérer data/cross-links.json (liens transverses) ───
      - name: Rebuild data/cross-links.json
        run: |
          if [ -f scripts/build_cross_links.py ]; then
            python3 scripts/build_cross_links.py
          else
            echo "⚠ scripts/build_cross_links.py introuvable, skip"
          fi

      # ─── 8) Régénérer data/fiche-graph.json (voisinages pour lecture continue) ───
      - name: Rebuild data/fiche-graph.json
        run: |
          if [ -f scripts/build_fiche_graph.py ]; then
            python3 scripts/build_fiche_graph.py
          else
            echo "⚠ scripts/build_fiche_graph.py introuvable, skip"
          fi

      # ─── 9) Configuration git + commit groupé ───
      - name: Commit & push regenerated files (with retry on conflict)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"

          # Stage tous les fichiers potentiellement modifiés
          git add fiches/index.html fiches/*.html 2>/dev/null || true
          git add data/search-index.json 2>/dev/null || true
          git add data/cross-links.json 2>/dev/null || true
          git add data/fiche-graph.json 2>/dev/null || true
          git add scenes/index.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "→ Aucun changement, rien à committer"
            exit 0
          fi

          CHANGED=$(git diff --cached --name-only | tr '\n' ' ')
          echo "Files changed: $CHANGED"

          git commit -m "chore: auto-rebuild indexes + inject components"

          # Retry logic : push avec rebase si conflit avec un autre workflow
          for i in 1 2 3; do
            # Pull rebase au cas où d'autres workflows ont pushé entre-temps
            git pull --rebase origin ${{ github.ref_name }} || true
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "✓ Push réussi à la tentative $i"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 2
          done
          echo "❌ Failed to push after 3 attempts"
          exit 1
